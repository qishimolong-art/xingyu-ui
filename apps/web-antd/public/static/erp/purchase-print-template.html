          return sections.size > 1 && Array.from(sections).some((section) => section !== 'outside');
        });
      }

      function applyDetailProperties() {
        if (!detailTable) return;
        const headerRows = detailRangeFromInputs(detailHeaderStartInput, detailHeaderEndInput);
        const bodyRows = detailRangeFromInputs(detailBodyStartInput, detailBodyEndInput, true);
        const footerRows = detailRangeFromInputs(detailFooterStartInput, detailFooterEndInput);
        const startColumn = detailStartColumnInput.value;
        const endColumn = detailEndColumnInput.value;
        if (!bodyRows || columns.indexOf(startColumn) < 0 || columns.indexOf(endColumn) < columns.indexOf(startColumn)) {
          showToast('明细表组件的列范围或循环行范围无效');
          return;
        }
        if ((headerRows && headerRows.end + 1 !== bodyRows.start)
          || (footerRows && footerRows.start !== bodyRows.end + 1)
          || (headerRows && headerRows.start > headerRows.end)
          || (footerRows && footerRows.start > footerRows.end)) {
          showToast('表头、循环体和表尾必须按顺序连续排列');
          return;
        }
        const previous = detailTable;
        detailTable = {
          id: 'detail-table', dataSource: 'items', startColumn, endColumn,
          headerRows, bodyRows, footerRows, repeatHeader: detailRepeatHeaderInput.checked,
        };
        if (detailComponentEndRow() > getMaxRow() || detailTableHasCrossBoundaryMerge(detailTable)) {
          detailTable = previous;
          showToast('组件范围超出模板或存在跨区合并单元格');
          return;
        }
        const errors = validateExplicitDetailTable(serializeTemplate(), true);
        if (errors.length) {
          detailTable = previous;
          refreshDetailTableDecorations();
          showToast(`组件范围不能应用：${errors.slice(0, 2).join('；')}`);
          return;
        }
        refreshDetailTableDecorations();
        updateDetailPanel();
        showToast('明细表组件范围已更新');
      }

      function removeDetailBindingsFromCell(cell) {
        const directDetail = fieldCodeIsDetail(cell.dataset.code);
        let html = String(cell.innerHTML || '');
        html = html.replace(/\$\{\s*([^}]+?)\s*\}/g, (match, raw) => (
          fieldCodeIsDetail(resolvePlaceholderCode(raw, cellPlaceholderCodeMap(cell, html))) ? '' : match
        ));
        if (directDetail && !html.includes('${')) html = '';
        cell.innerHTML = html;
        if (directDetail) clearFieldMeta(cell);
      }

      function removeDetailTable() {
        if (!detailTable) return;
        if (!window.confirm('移除明细表组件后将清除循环体内的明细字段绑定，但保留静态文字和样式。确定继续吗？')) return;
        root.querySelectorAll('[data-cell]').forEach((cell) => {
          if (cellFullyInDetailSection(cell, 'body')) removeDetailBindingsFromCell(cell);
        });
        detailTable = null;
        templateVersion = 2;
        root.classList.remove('has-detail-panel');
        updateDetailUi();
        showToast('明细表组件已移除');
      }

      function selectLegacyDetailCandidate() {
        const candidate = legacyDetailCandidate();
        if (!candidate?.bounds) return;
        selectCells(cellsInRect(candidate.bounds), 'range');
      }

      function convertLegacyDetailCandidate() {
        const candidate = legacyDetailCandidate();
        if (!candidate?.bounds) return;
        selectCells(cellsInRect(candidate.bounds), 'range');
        openDetailConversion(candidate.bounds, candidate);
      }

      function classFlags(cell) {
        return [
          'left',
          'center',
          'right',
          'bold',
          'logo',
          'blue-title',
          'contract-title',
          'line-bottom',
          'table-border',
          'border-top',
          'border-right',
          'border-bottom',
          'border-left',
          'gray'
        ].filter((name) => cell.classList.contains(name));
      }

      function columnWidthMap() {
        return Object.fromEntries(columns.map((col) => {
          const prop = `--col-${col.toLowerCase()}`;
          return [col, sheet.style.getPropertyValue(prop) || getComputedStyle(sheet).getPropertyValue(prop).trim() || '90px'];
        }));
      }

      function serializeTemplate() {
        return {
          version: templateVersion >= 2 ? 2 : 1,
          id: currentTemplateId,
          name: currentTemplateName,
          module: 'purchase-order',
          updatedAt: new Date().toISOString(),
          columns: [...columns],
          rowCount: getMaxRow(),
          columnWidths: columnWidthMap(),
          rowHeights: { ...rowHeights },
          paper: {
            size: paperConfig.size,
            width: paperConfig.width,
            height: paperConfig.height,
            orientation: paperConfig.orientation,
            margins: { ...paperConfig.margins },
          },
          selectedCell: selectedCell ? selectedCell.dataset.cell : '',
          detailTable: templateVersion >= 2 ? cloneDetailTable() : undefined,
          cells: Array.from(root.querySelectorAll('[data-cell]')).map((cell) => ({
            cell: cell.dataset.cell,
            html: cell.innerHTML,
            text: cell.textContent,
            name: cell.dataset.name || '',
            code: normalizeFieldCode(cell.dataset.code),
            placeholderCodes: cellPlaceholderCodeMap(cell),
            source: cell.dataset.source || '',
            colspan: colSpanOf(cell),
            rowspan: rowSpanOf(cell),
            fontSize: cell.style.fontSize || '',
            fontFamily: normalizeFontFamily(cell.dataset.fontFamily) || undefined,
            textAlign: textAlignOf(cell),
            classes: classFlags(cell)
          }))
        };
      }

      function loadTemplate(templateData) {
        if (!templateData || !Array.isArray(templateData.cells) || !Array.isArray(templateData.columns)) return;
        currentTemplateId = templateData.id || 'default';
        currentTemplateName = templateData.name || '默认模板';
        templateVersion = Number(templateData.version) >= 2 ? 2 : 1;
        columns = expandColumnsForPaper(templateData.columns, 18);
        detailTable = templateVersion >= 2 ? normalizeDetailTable(templateData.detailTable) : null;
        rowHeights = { ...(templateData.rowHeights || {}) };
        applyPaperConfig(templateData.paper || {});
        root.querySelectorAll('.cell').forEach((cell) => cell.remove());
        columns.forEach((col) => {
          const prop = `--col-${col.toLowerCase()}`;
          sheet.style.setProperty(prop, (templateData.columnWidths && templateData.columnWidths[col]) || '90px');
        });
        templateData.cells.forEach((item) => {
          if (!item || !item.cell) return;
          const cell = document.createElement('div');
          cell.className = ['cell', ...(Array.isArray(item.classes) ? item.classes : [])].join(' ');
          cell.dataset.cell = item.cell;
          cell.dataset.colspan = String(Math.max(1, Number(item.colspan) || 1));
          cell.dataset.rowspan = String(Math.max(1, Number(item.rowspan) || 1));
          if (item.name) cell.dataset.name = item.name;
          if (item.code) cell.dataset.code = normalizeFieldCode(item.code);
          if (item.placeholderCodes && typeof item.placeholderCodes === 'object') {
            cell.dataset.placeholderCodes = JSON.stringify(item.placeholderCodes);
          }
          if (item.source) cell.dataset.source = item.source;
          if (item.fontSize) cell.style.fontSize = item.fontSize;
          applyCellFontFamily(cell, item.fontFamily);
          applyTextAlign(cell, item.textAlign || alignFromClasses(item.classes || []));
          cell.innerHTML = item.html || '';
          sheet.appendChild(cell);
        });
        selectedCell = root.querySelector(`[data-cell="${templateData.selectedCell}"]`) || root.querySelector('[data-cell]:not(.gray)');
        selectedRange = selectedCell ? [selectedCell] : [];
        rangeStart = selectedCell;
        selectionMode = 'cell';
        selectedRow = null;
        selectedCol = null;
        refreshCells();
        updateTemplateTitle();
        updateDetailUi();
      }

      function buildTemplateSavePayload() {
        const data = serializeTemplate();
        data.id = currentTemplateId && currentTemplateId !== 'default' ? currentTemplateId : null;
        data.name = currentTemplateName;
        return {
          id: data.id,
          moduleKey,
          name: data.name || '默认模板',
          defaulted: false,
          templateJson: JSON.stringify(data),
          paperConfig: JSON.stringify({
            columns: data.columns,
            columnWidths: data.columnWidths,
            rowHeights: data.rowHeights,
            rowCount: data.rowCount,
            paper: data.paper,
          }),
          status: 0,
        };
      }

      function ensureTemplateCanSave() {
        const errors = validateExplicitDetailTable(serializeTemplate(), true);
        if (!errors.length) return true;
        showToast(`模板不能保存：${errors.slice(0, 3).join('；')}${errors.length > 3 ? ' 等' : ''}`);
        return false;
      }

      async function saveCurrentTemplate() {
        if (!canEditTemplate()) return;
        if (!ensureTemplateCanSave()) return;
        if (!currentTemplateId || currentTemplateId === 'default') {
          templateNameInput.value = currentTemplateName === '默认模板' ? '采购订单模板' : currentTemplateName;
          openModal(saveAsModal);
          templateNameInput.focus();
          templateNameInput.select();
          return;
        }
        try {
          const id = await apiRequest('/erp/print/template/save', {
            method: 'PUT',
            body: JSON.stringify(buildTemplateSavePayload()),
          });
          currentTemplateId = id || currentTemplateId;
          await refreshTemplateList();
          showToast('模板已保存');
        } catch (error) {
          showToast(error.message || '模板保存失败');
        }
      }

      async function saveAsCurrentTemplate(name) {
        if (!canEditTemplate()) return;
        if (!ensureTemplateCanSave()) return;
        const data = serializeTemplate();
        data.id = null;
        data.name = name;
        const payload = {
          id: null,
          moduleKey,
          name,
          defaulted: false,
          templateJson: JSON.stringify(data),
          paperConfig: JSON.stringify({
            columns: data.columns,
            columnWidths: data.columnWidths,
            rowHeights: data.rowHeights,
            rowCount: data.rowCount,
            paper: data.paper,
          }),
          status: 0,
        };
        const id = await apiRequest('/erp/print/template/save-as', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        currentTemplateId = id || currentTemplateId;
        currentTemplateName = name;
        currentTemplateDefaulted = false;
        await refreshTemplateList();
        updateTemplateTitle();
      }

      function loadTemplateFromResponse(template) {
        if (!template || !template.templateJson) {
          currentTemplateDefaulted = false;
          createBlankTemplate();
          updateTemplateTitle();
          return;
        }
        const data = parseJson(template.templateJson);
        if (!data) {
          currentTemplateDefaulted = false;
          createBlankTemplate();
          updateTemplateTitle();
          return;
        }
        data.id = template.id || data.id;
        data.name = template.name || data.name;
        currentTemplateDefaulted = Boolean(template.defaulted);
        loadTemplate(data);
      }

      async function loadTemplateList() {
        if (!canEditTemplate()) return;
        availableTemplates = await apiRequest(`/erp/print/template/list?moduleKey=${encodeURIComponent(moduleKey)}`) || [];
        renderTemplateOptions();
      }

      async function refreshTemplateList() {
        try {
          await loadTemplateList();
        } catch (error) {
          showToast(error.message || '模板列表刷新失败');
        }
      }

      async function loadTemplateById(templateId) {
        if (!templateId) {
          currentTemplateDefaulted = false;
          createBlankTemplate();
          updateTemplateTitle();
          return;
        }
        const template = await apiRequest(`/erp/print/template/get?id=${encodeURIComponent(templateId)}`);
        loadTemplateFromResponse(template);
      }

      async function restoreLastTemplate() {
        try {
          if (urlTemplateId) {
            await loadTemplateById(urlTemplateId);
          } else {
            const template = await apiRequest(`/erp/print/template/default?moduleKey=${encodeURIComponent(moduleKey)}`);
            loadTemplateFromResponse(template);
          }
        } catch (error) {
          createBlankTemplate();
          updateTemplateTitle();
          showToast(error.message || '读取模板失败，已使用默认模板');
        }
      }

      async function setCurrentTemplateDefault() {
        if (!canEditTemplate()) return;
        if (!currentTemplateId || currentTemplateId === 'default') {
          showToast('请先保存模板');
          return;
        }
        try {
          await apiRequest(`/erp/print/template/set-default?id=${encodeURIComponent(currentTemplateId)}`, {
            method: 'POST',
          });
          currentTemplateDefaulted = true;
          await refreshTemplateList();
          updateTemplateTitle();
          showToast('已设为默认模板');
        } catch (error) {
          showToast(error.message || '设置默认模板失败');
        }
      }

      async function deleteCurrentTemplate() {
        if (!canDeleteTemplate()) return;
        if (!currentTemplateId || currentTemplateId === 'default') {
          showToast('请先选择已保存的模板');
          return;
        }
        if (currentTemplateDefaulted) {
          showToast('默认模板不能删除，请先将其他模板设为默认');
          return;
        }
        const templateId = currentTemplateId;
        const templateName = currentTemplateName || '未命名模板';
        if (!window.confirm(`确定删除打印模板“${templateName}”吗？删除后将不再显示。`)) return;
        try {
          await apiRequest(`/erp/print/template/delete?id=${encodeURIComponent(templateId)}`, {
            method: 'DELETE',
          });
        } catch (error) {
          showToast(error.message || '模板删除失败');
          return;
        }
        currentTemplateId = 'default';
        currentTemplateName = '默认模板';
        currentTemplateDefaulted = false;
        try {
          await loadTemplateList();
          const fallbackTemplate = availableTemplates.find((item) => item.defaulted) || availableTemplates[0];
          if (fallbackTemplate) await loadTemplateById(fallbackTemplate.id);
          else createBlankTemplate();
          renderTemplateOptions();
          updatePanel(selectedCell);
          showToast(`模板“${templateName}”已删除`);
        } catch (error) {
          createBlankTemplate();
          showToast('模板已删除，但列表刷新失败，请重新打开设计器');
        }
      }

      function openModal(modal) {
        if (!modal) return;
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
      }

      function closeModal(modal) {
        if (!modal) return;
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
      }

      function previewClassName(cell) {
        return ['preview-cell', ...classFlags(cell)].join(' ');
      }

      function printClassName(cell) {
        return ['print-cell', ...classFlags(cell)].join(' ');
      }

      function resolvedCellHtml(source, item, itemIndex = 0, pageContext = null) {
        const code = normalizeFieldCode(source.dataset.code || item.code);
        const html = item.html || '';
        const placeholderCodes = { ...(item.placeholderCodes || {}) };
        const name = source.dataset.name || item.name || '';
        if (name && code) placeholderCodes[name] = code;
        if (!businessId) return html;
        if (!code) return html.includes('${')
          ? renderFieldPlaceholders(html, itemIndex, placeholderCodes, pageContext)
          : html;
        const singleFieldText = fieldDisplay(name);
        if (html.includes('${') && source.textContent.trim() !== singleFieldText) {
          return renderFieldPlaceholders(html, itemIndex, placeholderCodes, pageContext);
        }
        const value = resolvePrintValue(code, itemIndex, pageContext);
        return escapeHtml(value === undefined || value === null ? '' : value);
      }

      function itemRows(data) {
        const rows = new Set();
        data.cells.forEach((item) => {
          const code = normalizeFieldCode(item.code);
          const html = String(item.html || '');
          const hasItemField = code.startsWith('items.') || /\$\{\s*items\./.test(html) || hasItemPlaceholder(html, item.placeholderCodes || {});
          if (!hasItemField) return;
          const source = root.querySelector(`[data-cell="${item.cell}"]`);
          if (!source || source.classList.contains('gray')) return;
          const parts = cellParts(source);
          const rowspan = Math.max(1, Number(item.rowspan) || rowSpanOf(source));
          for (let row = parts.row; row < parts.row + rowspan; row += 1) {
            rows.add(row);
          }
        });
        return Array.from(rows).sort((a, b) => a - b);
      }

      function detailBlocks(data) {
        if (Number(data?.version) >= 2 && data?.detailTable) {
          const table = normalizeDetailTable(data.detailTable);
          return table ? [{ start: table.bodyRows.start, end: table.bodyRows.end }] : [];
        }
        const rows = itemRows(data);
        if (!rows.length) return [];
        const blocks = [];
        rows.forEach((row) => {
          const last = blocks[blocks.length - 1];
          if (last && row <= last.end + 1) last.end = row;
          else blocks.push({ start: row, end: row });
        });

        let changed = true;
        while (changed) {
          changed = false;
          data.cells.forEach((item) => {
            const source = root.querySelector(`[data-cell="${item.cell}"]`);
            if (!source || source.classList.contains('gray')) return;
            const parts = cellParts(source);
            const start = parts.row;
            const end = start + Math.max(1, Number(item.rowspan) || rowSpanOf(source)) - 1;
            const block = blocks.find((entry) => start <= entry.end && end >= entry.start);
            if (!block) return;
            const nextStart = Math.min(block.start, start);
            const nextEnd = Math.max(block.end, end);
            if (nextStart !== block.start || nextEnd !== block.end) {
              block.start = nextStart;
              block.end = nextEnd;
              changed = true;
            }
          });
          blocks.sort((a, b) => a.start - b.start);
          for (let index = 0; index < blocks.length - 1; index += 1) {
            const current = blocks[index];
            const next = blocks[index + 1];
            if (current.end + 1 < next.start) continue;
            current.end = Math.max(current.end, next.end);
            blocks.splice(index + 1, 1);
            changed = true;
            break;
          }
        }
        return blocks;
      }

      function buildRenderPlan(data, options = {}) {
        const startRow = Math.max(1, Math.min(data.rowCount || 1, Number(options.startRow) || 1));
        const endRow = Math.min(data.rowCount || 1, lastRenderableSourceRow(data));
        const rowCount = Math.max(0, endRow - startRow + 1);
        const rows = Array.from({ length: rowCount }, (_, index) => startRow + index);
        const items = Array.isArray(printData?.items) ? printData.items : [];
        const explicitDetail = Number(data?.version) >= 2 && Boolean(data?.detailTable);
        const shouldRepeat = Boolean(options.repeatDetailRows && options.resolveFields && businessId
          && (explicitDetail || items.length));
        const blocks = shouldRepeat ? detailBlocks(data) : [];
        const rowPlans = [];
        rows.forEach((row) => {
          const block = blocks.find((entry) => entry.start === row);
          if (block) {
            if (explicitDetail && !items.length) {
              for (let sourceRow = block.start; sourceRow <= block.end; sourceRow += 1) {
                rowPlans.push({ sourceRow, itemIndex: 0, detail: false, emptyDetail: true });
              }
              return;
            }
            items.forEach((_, itemIndex) => {
              for (let sourceRow = block.start; sourceRow <= block.end; sourceRow += 1) {
                rowPlans.push({ sourceRow, itemIndex, detail: true });
              }
            });
            return;
          }
          if (blocks.some((entry) => row > entry.start && row <= entry.end)) return;
          rowPlans.push({ sourceRow: row, itemIndex: 0, detail: false });
        });
        return {
          rowPlans,
          rowMap: rowPlans.reduce((map, plan, index) => {
            const key = `${plan.sourceRow}:${plan.detail ? plan.itemIndex : 'base'}`;
            map.set(key, index + 1);
            return map;
          }, new Map()),
          blocks
        };
      }

      function renderRowHeight(data, row) {
        return data.rowHeights[row] || '34px';
      }

      function renderRowHeightValue(data, row) {
        return Math.max(minRowHeight, cssSizeToNumber(renderRowHeight(data, row), 34));
      }

      function paperContentHeightPx() {
        const size = paperSizeInMm();
        return Math.max(
          1,
          mmToPx(size.height) - mmToPx(paperConfig.margins.top) - mmToPx(paperConfig.margins.bottom),
        );
      }

      function planKey(plan) {
        return `${plan.sourceRow}:${plan.detail ? plan.itemIndex : 'base'}`;
      }

      function plannedRowHeight(data, plan, measuredPlanHeights) {
        const measuredHeight = Number(measuredPlanHeights?.get(planKey(plan)));
        return Number.isFinite(measuredHeight) && measuredHeight > 0
          ? Math.max(minRowHeight, measuredHeight)
          : renderRowHeightValue(data, plan.sourceRow);
      }

      function planHeight(data, plans, measuredPlanHeights) {
        return plans.reduce(
          (total, plan) => total + plannedRowHeight(data, plan, measuredPlanHeights),
          0,
        );
      }

      function splitPlansByHeight(data, plans, capacity, measuredPlanHeights) {
        const pages = [];
        let current = [];
        let used = 0;
        plans.forEach((plan) => {
          const height = plannedRowHeight(data, plan, measuredPlanHeights);
          if (current.length && used + height > capacity) {
            pages.push(current);
            current = [];
            used = 0;
          }
          current.push(plan);
          used += height;
        });
        if (current.length || !pages.length) pages.push(current);
        return pages;
      }

      function cellRowRange(item) {
        const match = String(item.cell || '').match(/^([A-Z]+)(\d+)$/);
        const start = match ? Number(match[2]) : 1;
        return {
          start,
          end: start + Math.max(1, Number(item.rowspan) || 1) - 1,
        };
      }

      function hasTableBorderClass(item) {
        const classes = Array.isArray(item.classes) ? item.classes : [];
        return classes.some((name) => [
          'table-border',
          'manual-border',
          'border-top',
          'border-right',
          'border-bottom',
          'border-left',
          'line-bottom',
        ].includes(name));
      }

      function isItemFieldCell(item) {
        const code = normalizeFieldCode(item.code);
        const html = String(item.html || '');
        return code.startsWith('items.') || /\$\{\s*items\./.test(html) || hasItemPlaceholder(html, item.placeholderCodes || {});
      }

      function formatRenderRowHeight(height) {
        return `${Math.max(minRowHeight, Math.ceil(height || 0))}px`;
      }

      function isRenderablePrintCell(source, item) {
        if (!source || source.classList.contains('gray')) return false;
        const visibleText = String(source.textContent || '').trim();
        const html = String(item.html || source.innerHTML || '').replace(/<br\s*\/?>/gi, '').trim();
        const classes = Array.isArray(item.classes) ? item.classes : classFlags(source);
        const visibleClasses = [
          'bold',
          'logo',
          'blue-title',
          'contract-title',
          'line-bottom',
          'table-border',
          'border-top',
          'border-right',
          'border-bottom',
          'border-left',
        ];
        return Boolean(
          visibleText ||
          html ||
          item.name ||
          item.code ||
          item.source ||
          (Array.isArray(item.placeholderCodes) && item.placeholderCodes.length) ||
          Number(item.colspan) > 1 ||
          Number(item.rowspan) > 1 ||
          visibleClasses.some((name) => classes.includes(name))
        );
      }

      function renderBoundsForSheet(data) {
        const bounds = data.cells.reduce((state, item) => {
          if (!item || !item.cell) return state;
          const source = root.querySelector(`[data-cell="${item.cell}"]`);
          if (!isRenderablePrintCell(source, item)) return state;
          const parts = cellParts(source);
          const index = data.columns.indexOf(parts.col);
          if (index < 0) return state;
          const colspan = Math.max(1, Number(item.colspan) || 1);
          state.hasRenderableCell = true;
          state.minRow = Math.min(state.minRow, parts.row);
          state.minColumnIndex = Math.min(state.minColumnIndex, index);
          state.maxColumnIndex = Math.max(state.maxColumnIndex, index + colspan - 1);
          return state;
        }, {
          hasRenderableCell: false,
          minRow: Number.POSITIVE_INFINITY,
          minColumnIndex: Number.POSITIVE_INFINITY,
          maxColumnIndex: 0,
        });
        if (!bounds.hasRenderableCell) {
          return { minRow: 1, minColumnIndex: 0, maxColumnIndex: 0 };
        }
        return bounds;
      }

      function renderColumnsForSheet(data, bounds) {
        const start = Math.max(0, bounds.minColumnIndex);
        const end = Math.max(start + 1, bounds.maxColumnIndex + 1);
        return data.columns.slice(start, end);
      }

      function sumRenderRowHeights(heights, startRow, rowspan) {
        let total = 0;
        for (let index = startRow - 1; index < startRow - 1 + rowspan; index += 1) {
          total += heights[index] || 34;
        }
        return total;
      }

      function setRenderedCellMinHeight(cell, rowHeights) {
        const outputRow = Number(cell.dataset.renderRow) || 1;
        const rowspan = Math.max(1, Number(cell.dataset.renderRowspan) || 1);
        const minHeight = rowspan > 1
          ? sumRenderRowHeights(rowHeights, outputRow, rowspan)
          : (rowHeights[outputRow - 1] || 34);
        cell.style.minHeight = `${Math.ceil(minHeight)}px`;
      }

      function lastRenderableSourceRow(data) {
        return data.cells.reduce((maxRow, item) => {
          if (!item || !item.cell) return maxRow;
          const source = root.querySelector(`[data-cell="${item.cell}"]`);
          if (!isRenderablePrintCell(source, item)) return maxRow;
          return Math.max(maxRow, cellRowRange(item).end);
        }, 1);
      }

      function isPageContextCell(item) {
        const source = root.querySelector(`[data-cell="${item.cell}"]`);
        const code = normalizeFieldCode(source?.dataset.code || item.code);
        const html = String(item.html || source?.innerHTML || '');
        const placeholderCodes = Object.values(item.placeholderCodes || {})
          .map((value) => normalizeFieldCode(value));
        return ['print.pageNo', 'print.pageCount', 'print.pageText'].includes(code)
          || /\$\{\s*print\.(?:pageNo|pageCount|pageText)\s*\}/.test(html)
          || placeholderCodes.some((value) => ['print.pageNo', 'print.pageCount', 'print.pageText'].includes(value));
      }

      function pageContextRows(data) {
        return new Set(data.cells.reduce((rows, item) => {
          if (!item?.cell || !isPageContextCell(item)) return rows;
          rows.push(cellRowRange(item).start);
          return rows;
        }, []));
      }

      function rowHasDetailHeaderBorder(data, row, table = null) {
        const tableLeft = table ? data.columns.indexOf(table.startColumn) : 0;
        const tableRight = table ? data.columns.indexOf(table.endColumn) : data.columns.length - 1;
        return data.cells.some((item) => {
          if (!item?.cell || !hasTableBorderClass(item)) return false;
          const source = root.querySelector(`[data-cell="${item.cell}"]`);
          if (!isRenderablePrintCell(source, item)) return false;
          const range = cellRowRange(item);
          if (row < range.start || row > range.end) return false;
          if (!table) return true;
          const parts = parseCellId(item.cell);
          const start = data.columns.indexOf(parts.col);
          const end = start + Math.max(1, Number(item.colspan) || 1) - 1;
          return start <= tableRight && end >= tableLeft;
        });
      }

      function detectDetailHeaderRows(data, blocks) {
        if (Number(data?.version) >= 2 && data?.detailTable) {
          const table = normalizeDetailTable(data.detailTable);
          if (!table?.headerRows || table.repeatHeader === false) return [];
          const configuredRows = Array.from(
            { length: table.headerRows.end - table.headerRows.start + 1 },
            (_, index) => table.headerRows.start + index,
          );
          const repeatableRows = [];
          for (let index = configuredRows.length - 1; index >= 0; index -= 1) {
            const row = configuredRows[index];
            if (!rowHasDetailHeaderBorder(data, row, table)) {
              if (repeatableRows.length) break;
              continue;
            }
            repeatableRows.unshift(row);
          }
          return repeatableRows.length ? repeatableRows : [table.headerRows.end];
        }
        const firstBlock = blocks[0];
        if (!firstBlock) return [];
        const rows = [];
        for (let row = firstBlock.start - 1; row >= 1; row -= 1) {
          const rowCells = data.cells.filter((item) => {
            if (!item || !item.cell) return false;
            const source = root.querySelector(`[data-cell="${item.cell}"]`);
            if (!isRenderablePrintCell(source, item)) return false;
            const range = cellRowRange(item);
            return range.start <= row && row <= range.end;
          });
          const hasHeaderCell = rowCells.some((item) => hasTableBorderClass(item) && !isItemFieldCell(item));
          if (!hasHeaderCell) break;
          rows.unshift(row);
        }
        return rows;
      }

      function paginateDetailRows(data, renderPlan, options = {}) {
        if (!options.paginate) return [renderPlan.rowPlans];
        const capacity = paperContentHeightPx();
        const measuredPlanHeights = options.measuredPlanHeights;
        const items = Array.isArray(printData?.items) ? printData.items : [];
        if (!renderPlan.blocks.length || !items.length) {
          return splitPlansByHeight(data, renderPlan.rowPlans, capacity, measuredPlanHeights);
        }

        const firstBlock = renderPlan.blocks[0];
        const lastBlock = renderPlan.blocks[renderPlan.blocks.length - 1];
        const headerRows = new Set(detectDetailHeaderRows(data, renderPlan.blocks));
        const headerPlans = renderPlan.rowPlans.filter((plan) => !plan.detail && headerRows.has(plan.sourceRow));
        const detailPlansByItem = items.map((_, itemIndex) =>
          renderPlan.rowPlans.filter((plan) => plan.detail && plan.itemIndex === itemIndex),
        );
        const lastRenderableRow = lastRenderableSourceRow(data);
        const topBoundary = headerRows.size ? Math.min(...headerRows) : firstBlock.start;
        const topPlans = renderPlan.rowPlans.filter((plan) => !plan.detail && plan.sourceRow < topBoundary);
        const contextRows = pageContextRows(data);
        headerRows.forEach((row) => contextRows.delete(row));
        const continuationPagePlans = topPlans.filter((plan) => contextRows.has(plan.sourceRow));
        const bottomPlans = renderPlan.rowPlans.filter((plan) => !plan.detail && plan.sourceRow > lastBlock.end && plan.sourceRow <= lastRenderableRow);
        const pages = [];
        let nextItemIndex = 0;

        function createDetailPage(basePlans, allowBottom) {
          const page = [...basePlans];
          let used = planHeight(data, page, measuredPlanHeights);
          let detailCount = 0;
          while (nextItemIndex < detailPlansByItem.length) {
            const group = detailPlansByItem[nextItemIndex];
            const groupHeight = planHeight(data, group, measuredPlanHeights);
            if (detailCount > 0 && used + groupHeight > capacity) break;
            if (!detailCount && used + groupHeight > capacity && page.length > basePlans.length) break;
            page.push(...group);
            used += groupHeight;
            nextItemIndex += 1;
            detailCount += 1;
            if (used >= capacity) break;
          }
          if (!detailCount && nextItemIndex < detailPlansByItem.length) {
            page.push(...detailPlansByItem[nextItemIndex]);
            nextItemIndex += 1;
          }
          if (allowBottom && nextItemIndex >= detailPlansByItem.length) {
            const bottomHeight = planHeight(data, bottomPlans, measuredPlanHeights);
            if (used + bottomHeight <= capacity) {
              page.push(...bottomPlans);
              return { page, bottomPlaced: true };
            }
          }
          return { page, bottomPlaced: false };
        }

        const first = createDetailPage([...topPlans, ...headerPlans], true);
        pages.push(first.page);
        let bottomPlaced = first.bottomPlaced;

        while (nextItemIndex < detailPlansByItem.length) {
          const result = createDetailPage([...continuationPagePlans, ...headerPlans], true);
          pages.push(result.page);
          bottomPlaced = result.bottomPlaced;
        }

        if (!bottomPlaced && bottomPlans.length) {
          const remainingCapacity = Math.max(
            1,
            capacity - planHeight(data, [...continuationPagePlans, ...headerPlans], measuredPlanHeights),
          );
          splitPlansByHeight(data, bottomPlans, remainingCapacity, measuredPlanHeights)
            .forEach((page) => pages.push([...continuationPagePlans, ...headerPlans, ...page]));
        }

        return pages.filter((page) => page.length);
      }

      function measureRenderRowHeights(sheetNode, rowHeights) {
        const measuredHeights = rowHeights.map((height) => Math.max(minRowHeight, Number(height) || 34));
        const measureHost = document.createElement('div');
        measureHost.style.position = 'absolute';
        measureHost.style.left = '-100000px';
        measureHost.style.top = '0';
        measureHost.style.visibility = 'hidden';
        measureHost.style.pointerEvents = 'none';
        measureHost.style.zIndex = '-1';
        root.appendChild(measureHost);
        measureHost.appendChild(sheetNode);
        for (let pass = 0; pass < 6; pass += 1) {
          let changed = false;
          sheetNode.style.gridTemplateRows = measuredHeights.map(formatRenderRowHeight).join(' ');
          Array.from(sheetNode.children).forEach((cell) => setRenderedCellMinHeight(cell, measuredHeights));
          Array.from(sheetNode.children).forEach((cell) => {
            const outputRow = Number(cell.dataset.renderRow) || 1;
            const rowspan = Math.max(1, Number(cell.dataset.renderRowspan) || 1);
            const availableHeight = sumRenderRowHeights(measuredHeights, outputRow, rowspan);
            const contentHeight = Math.ceil(cell.scrollHeight);
            if (contentHeight <= availableHeight + 1) return;
            const measuredHeight = contentHeight + 8;
            const extraHeight = (measuredHeight - availableHeight) / rowspan;
            for (let index = outputRow - 1; index < outputRow - 1 + rowspan; index += 1) {
              measuredHeights[index] = Math.max(measuredHeights[index] || 34, (measuredHeights[index] || 34) + extraHeight);
            }
            changed = true;
          });
          if (!changed) break;
        }
        sheetNode.remove();
        measureHost.remove();
        return measuredHeights;
      }

      function renderTemplateSheet(classNameResolver, options = {}) {
        const data = options.data || serializeTemplate();
        const renderBounds = options.renderBounds || renderBoundsForSheet(data);
        const renderColumns = options.renderColumns || renderColumnsForSheet(data, renderBounds);
        const renderPlan = options.renderPlan || buildRenderPlan(data, { ...options, startRow: renderBounds.minRow });
        const rowPlans = options.rowPlans || renderPlan.rowPlans;
        const rowMap = rowPlans.reduce((map, plan, index) => {
          map.set(planKey(plan), index + 1);
          return map;
        }, new Map());
        const sheetNode = document.createElement('div');
        if (options.sheetClassName) sheetNode.className = options.sheetClassName;
        const outputRowHeights = rowPlans.map((plan) => renderRowHeightValue(data, plan.sourceRow));
        sheetNode.style.gridTemplateColumns = renderColumns.map((col) => (data.columnWidths[col] || '90px')).join(' ');
        sheetNode.style.gridTemplateRows = outputRowHeights.map(formatRenderRowHeight).join(' ');
        data.cells.forEach((item) => {
          const source = root.querySelector(`[data-cell="${item.cell}"]`);
          if (!isRenderablePrintCell(source, item)) return;
          const parts = cellParts(source);
          const colIndex = renderColumns.indexOf(parts.col);
          if (colIndex < 0) return;
          if (options.continuationPage && options.continuationPageRows?.has(parts.row)
            && !isPageContextCell(item)) return;
          const colspan = Math.max(1, Number(item.colspan) || 1);
          const rowspan = Math.max(1, Number(item.rowspan) || 1);
          const block = renderPlan.blocks.find((entry) => parts.row >= entry.start && parts.row <= entry.end);
          const explicitDetail = Number(data?.version) >= 2 && Boolean(data?.detailTable);
          const items = Array.isArray(printData?.items) ? printData.items : [];
          const explicitBodyCell = explicitDetail && block
            && cellFullyInDetailSection(source, 'body', normalizeDetailTable(data.detailTable));
          let renderTargets = [{ itemIndex: 0, detail: false }];
          if (block && explicitBodyCell) {
            renderTargets = items.length
              ? items.map((_, itemIndex) => ({ itemIndex, detail: true }))
              : [];
          } else if (block) {
            renderTargets = items.length
              ? [{ itemIndex: 0, detail: true }]
              : [{ itemIndex: 0, detail: false }];
          }
          renderTargets.forEach((target) => {
            const rowKey = `${parts.row}:${target.detail ? target.itemIndex : 'base'}`;
            const outputRow = rowMap.get(rowKey);
            if (!outputRow) return;
            const cell = document.createElement('div');
            cell.className = classNameResolver(source);
            cell.dataset.renderRow = String(outputRow);
            cell.dataset.renderRowspan = String(rowspan);
            cell.style.gridColumn = `${colIndex + 1} / span ${colspan}`;
            cell.style.gridRow = `${outputRow} / span ${rowspan}`;
            setRenderedCellMinHeight(cell, outputRowHeights);
            if (item.fontSize) cell.style.fontSize = item.fontSize;
            applyCellFontFamily(cell, item.fontFamily);
            cell.innerHTML = options.resolveFields
              ? resolvedCellHtml(source, item, target.itemIndex, options.pageContext)
              : (item.html || '');
            sheetNode.appendChild(cell);
          });
        });
        if (options.autoFitRows) {
          const measuredHeights = measureRenderRowHeights(sheetNode, outputRowHeights);
          sheetNode.style.gridTemplateRows = measuredHeights.map(formatRenderRowHeight).join(' ');
          Array.from(sheetNode.children).forEach((cell) => setRenderedCellMinHeight(cell, measuredHeights));
        }
        return sheetNode;
      }

      function renderTemplatePages(classNameResolver, sheetClassName, pageClassName, options = {}) {
        const data = serializeTemplate();
        const renderBounds = renderBoundsForSheet(data);
        const renderColumns = renderColumnsForSheet(data, renderBounds);
        const renderPlan = buildRenderPlan(data, { ...options, startRow: renderBounds.minRow });
        let measuredPlanHeights;
        if (options.paginate && options.resolveFields && options.autoFitRows) {
          const measurementSheet = renderTemplateSheet(classNameResolver, {
            ...options,
            data,
            renderBounds,
            renderColumns,
            renderPlan,
            rowPlans: renderPlan.rowPlans,
            sheetClassName,
            pageContext: { pageNo: 1, pageCount: 1 },
          });
          const measuredRows = String(measurementSheet.style.gridTemplateRows || '')
            .split(/\s+/)
            .filter(Boolean)
            .map((height) => cssSizeToNumber(height, 0));
          measuredPlanHeights = new Map(
            renderPlan.rowPlans.map((plan, index) => [
              planKey(plan),
              measuredRows[index] || renderRowHeightValue(data, plan.sourceRow),
            ]),
          );
          measurementSheet.remove();
        }
        const pages = paginateDetailRows(data, renderPlan, { ...options, measuredPlanHeights });
        const pageCount = pages.length;
        const continuationPageRows = pageContextRows(data);
        detectDetailHeaderRows(data, renderPlan.blocks)
          .forEach((row) => continuationPageRows.delete(row));
        return pages.map((rowPlans, pageIndex) => {
          const sheetNode = renderTemplateSheet(classNameResolver, {
            ...options,
            data,
            renderBounds,
            renderColumns,
            renderPlan,
            rowPlans,
            sheetClassName,
            continuationPage: pageIndex > 0,
            continuationPageRows,
            pageContext: { pageNo: pageIndex + 1, pageCount },
          });
          return createPaperRenderPage(sheetNode, pageClassName);
        });
      }

      async function renderPreview() {
        try {
          await ensurePrintFontsLoaded();
          const pages = renderTemplatePages(previewClassName, 'preview-sheet', 'preview-page', {
            resolveFields: true,
            repeatDetailRows: true,
            paginate: true,
            autoFitRows: true,
          });
          previewContent.replaceChildren(...pages);
          openModal(previewModal);
        } catch (error) {
          showToast(error.message || '内置打印字体加载失败，请重试');
        }
      }

      function renderPrintDocument() {
        const pages = renderTemplatePages(printClassName, 'print-sheet', 'print-page', {
          resolveFields: true,
          repeatDetailRows: true,
          paginate: true,
          autoFitRows: true,
        });
        printRoot.replaceChildren(...pages);
        printRoot.setAttribute('aria-hidden', 'false');
      }

      function clearPrintDocument() {
        printRoot.replaceChildren();
        printRoot.setAttribute('aria-hidden', 'true');
      }

      async function recordCurrentPrint() {
        if (!businessId) return;
        await apiRequest('/erp/print/record', {
          method: 'POST',
          body: JSON.stringify({
            moduleKey,
            businessId,
            businessNo,
            templateId: currentTemplateId && currentTemplateId !== 'default' ? currentTemplateId : null,
          }),
        });
      }

      async function printCurrentTemplate() {
        try {
          await ensurePrintFontsLoaded();
          await recordCurrentPrint();
          renderPrintDocument();
          window.print();
          notifyPrinted();
          window.setTimeout(clearPrintDocument, 300);
        } catch (error) {
          showToast(error.message || '打印失败');
          clearPrintDocument();
        }
      }

      function forEachSelected(callback) {
        selectedTargets().forEach((cell) => {
          if (cell && !cell.classList.contains('gray')) callback(cell);
        });
      }

      function toggleBold() {
        if (!canEditTemplate()) return;
        const targets = selectedTargets().filter((cell) => cell && !cell.classList.contains('gray'));
        if (!targets.length) return;
        const shouldBold = targets.some((cell) => !cell.classList.contains('bold'));
        targets.forEach((cell) => cell.classList.toggle('bold', shouldBold));
      }

      function applyFontSize() {
        if (!canEditTemplate()) return;
        forEachSelected((cell) => {
          cell.style.fontSize = `${fontSizeSelect.value}pt`;
        });
      }

      function applyFontFamily() {
        if (!canEditTemplate() || fontFamilySelect.value === '__mixed') return;
        forEachSelected((cell) => applyCellFontFamily(cell, fontFamilySelect.value));
        updateFontFamilySelect();
        if (fontFamilySelect.value) {
          Promise.all([
            loadPrintFontFace(fontFamilySelect.value, 400),
            loadPrintFontFace(fontFamilySelect.value, 700),
          ]).catch((error) => showToast(error.message || '内置打印字体加载失败'));
        }
      }

      function applyTextAlignment(align) {
        if (!canEditTemplate()) return;
        forEachSelected((cell) => applyTextAlign(cell, align));
        updateAlignButtons(selectedCell);
      }

      function setCellBorder(cell, side, enabled) {
        if (side === 'top') cell.classList.toggle('border-top', enabled);
        if (side === 'right') cell.classList.toggle('border-right', enabled);
        if (side === 'bottom') cell.classList.toggle('border-bottom', enabled);
        if (side === 'left') cell.classList.toggle('border-left', enabled);
      }

      function clearBorders(cell) {
        ['border-top', 'border-right', 'border-bottom', 'border-left', 'manual-border'].forEach((name) => cell.classList.remove(name));
      }

      function applyBorder(action) {
        if (!canEditTemplate()) return;
        const targets = selectedTargets().filter((cell) => cell && !cell.classList.contains('gray'));
        const bounds = getSelectionBounds(targets);
        if (!targets.length || !bounds) return;
        if (action === 'clear') {
          targets.forEach(clearBorders);
          return;
        }
        if (action === 'all') {
          targets.forEach((cell) => {
            ['top', 'right', 'bottom', 'left'].forEach((side) => setCellBorder(cell, side, true));
          });
          return;
        }
        targets.forEach((cell) => {
          const parts = cellParts(cell);
          const col = columnIndex(parts.col);
          if (action === 'top' && parts.row === bounds.top) setCellBorder(cell, 'top', true);
          if (action === 'right' && col + colSpanOf(cell) - 1 === bounds.right) setCellBorder(cell, 'right', true);
          if (action === 'bottom' && parts.row + rowSpanOf(cell) - 1 === bounds.bottom) setCellBorder(cell, 'bottom', true);
          if (action === 'left' && col === bounds.left) setCellBorder(cell, 'left', true);
        });
      }

      function unmergeCell(cell) {
        if (!cell || (colSpanOf(cell) === 1 && rowSpanOf(cell) === 1)) return;
        cell.dataset.colspan = '1';
        cell.dataset.rowspan = '1';
        cell.style.gridColumn = '';
        cell.style.gridRow = '';
      }

      function mergeCells() {
        if (!canEditTemplate()) return;
        if (!selectedCell || selectedCell.classList.contains('gray')) return;
        const currentTargets = selectedTargets().filter((cell) => cell && !cell.classList.contains('gray'));
        const currentBounds = getSelectionBounds(currentTargets);
        const isSingleMergedCell = currentTargets.length === 1 && selectedCell && (colSpanOf(selectedCell) > 1 || rowSpanOf(selectedCell) > 1);
        if (isSingleMergedCell) {
          unmergeCell(selectedCell);
          clearRange();
          refreshCells();
          selectCell(selectedCell);
          return;
        }
        if (!currentBounds) return;
        const bounds = expandRangeForMergedCells(currentBounds);
        if (bounds.left === bounds.right && bounds.top === bounds.bottom) return;
        if (detailTable) {
          const sections = new Set();
          for (let row = bounds.top; row <= bounds.bottom; row += 1) {
            for (let col = bounds.left; col <= bounds.right; col += 1) {
              sections.add(detailSectionForPosition(row, col));
            }
          }
          if (sections.size > 1) {
            showToast('不能合并跨越明细表表头、循环体、表尾或组件边界的单元格');
            return;
          }
        }

        currentTargets.forEach(unmergeCell);
        refreshCells();
        const mergeRange = cellsInRect(bounds);
        const expectedCount = (bounds.right - bounds.left + 1) * (bounds.bottom - bounds.top + 1);
        if (mergeRange.length !== expectedCount) return;

        const master = getCell(columns[bounds.left], bounds.top);
        if (!master) return;
        master.dataset.colspan = String(bounds.right - bounds.left + 1);
        master.dataset.rowspan = String(bounds.bottom - bounds.top + 1);
        master.innerHTML = mergeRange.map(cellHtml).filter(Boolean).join(' ');
        mergeRange.filter((cell) => cell !== master).forEach((cell) => {
          cell.remove();
        });
        clearRange();
        refreshCells();
        selectCell(master);
      }

      function activeRow() {
        return selectedRow || (selectedCell ? Number(rowOf(selectedCell)) : 1);
      }

      function activeColIndex() {
        if (selectedCol) return columnIndex(selectedCol);
        return selectedCell ? columnIndex(columnOf(selectedCell)) : 0;
      }

      function detailSectionForRow(row, table = detailTable) {
        if (!table) return 'outside';
        if (table.headerRows && row >= table.headerRows.start && row <= table.headerRows.end) return 'header';
        if (row >= table.bodyRows.start && row <= table.bodyRows.end) return 'body';
        if (table.footerRows && row >= table.footerRows.start && row <= table.footerRows.end) return 'footer';
        return 'outside';
      }

      function adjustDetailTableForRowInsert(newRow, sectionHint) {
        if (!detailTable) return;
        const sectionNames = ['headerRows', 'bodyRows', 'footerRows'];
        const targetName = sectionHint === 'header' ? 'headerRows'
          : sectionHint === 'body' ? 'bodyRows'
            : sectionHint === 'footer' ? 'footerRows' : '';
        let targetPassed = false;
        sectionNames.forEach((name) => {
          const range = detailTable[name];
          if (!range) return;
          if (targetName) {
            if (name === targetName) {
              range.end += 1;
              targetPassed = true;
            } else if (targetPassed) {
              range.start += 1;
              range.end += 1;
            }
            return;
          }
          if (newRow <= range.start) {
            range.start += 1;
            range.end += 1;
          } else if (newRow <= range.end) {
            range.end += 1;
          }
        });
      }

      function adjustDetailTableForRowDelete(row) {
        if (!detailTable) return;
        const sectionNames = ['headerRows', 'bodyRows', 'footerRows'];
        let removedSection = false;
        sectionNames.forEach((name) => {
          const range = detailTable[name];
          if (!range) return;
          if (removedSection || row < range.start) {
            range.start -= 1;
            range.end -= 1;
          } else if (row <= range.end) {
            if (range.start === range.end && name !== 'bodyRows') detailTable[name] = null;
            else range.end -= 1;
            removedSection = true;
          }
        });
      }

      function adjustDetailTableForColumnInsert(insertIndex, insideComponent) {
        if (!detailTable) return;
        let left = columns.indexOf(detailTable.startColumn);
        let right = columns.indexOf(detailTable.endColumn);
        if (insideComponent) right += 1;
        else if (insertIndex <= left) {
          left += 1;
          right += 1;
        }
        detailTable.startColumn = columnLabel(left);
        detailTable.endColumn = columnLabel(right);
      }

      function adjustDetailTableForColumnDelete(index) {
        if (!detailTable) return;
        let left = columns.indexOf(detailTable.startColumn);
        let right = columns.indexOf(detailTable.endColumn);
        if (index < left) {
          left -= 1;
          right -= 1;
        } else if (index <= right) {
          right -= 1;
        }
        detailTable.startColumn = columnLabel(left);
        detailTable.endColumn = columnLabel(right);
      }

      function addRow(position = 'after') {
        if (!canEditTemplate()) return;
        if (!selectedCell) return;
        const row = activeRow();
        const insertBefore = position === 'before';
        const newRow = insertBefore ? row : row + 1;
        const boundaryRow = insertBefore ? row - 1 : row;
        adjustDetailTableForRowInsert(newRow, detailSectionForRow(row));
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => Number(rowOf(b)) - Number(rowOf(a)))
          .forEach((cell) => {
            const parts = cellParts(cell);
            const rowspan = rowSpanOf(cell);
            const endRow = parts.row + rowspan - 1;
            if (parts.row >= newRow) setCellPosition(cell, parts.col, parts.row + 1);
            else if (parts.row <= boundaryRow && endRow > boundaryRow) cell.dataset.rowspan = String(rowspan + 1);
          });
        rowHeights = Object.fromEntries(Object.entries(rowHeights).map(([key, value]) => {
          const number = Number(key);
          return [number >= newRow ? number + 1 : number, value];
        }));
        columns.forEach((col, index) => {
          if (!coveredBySpan(newRow, index)) sheet.appendChild(createCell(col, newRow, ''));
        });
        refreshCells();
        selectCell(getCell('A', newRow));
      }

      function deleteRow() {
        if (!canEditTemplate()) return;
        if (!selectedCell) return;
        const row = activeRow();
        if (getRows().length <= 1) return;
        if (detailTable && row >= detailTable.bodyRows.start && row <= detailTable.bodyRows.end
          && detailTable.bodyRows.start === detailTable.bodyRows.end) {
          showToast('循环体至少保留一条模板行，不能删除');
          return;
        }
        adjustDetailTableForRowDelete(row);
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => Number(rowOf(a)) - Number(rowOf(b)))
          .forEach((cell) => {
            const parts = cellParts(cell);
            const rowspan = rowSpanOf(cell);
            const endRow = parts.row + rowspan - 1;
            if (parts.row === row) {
              if (rowspan > 1) {
                cell.dataset.rowspan = String(rowspan - 1);
              } else {
                cell.remove();
              }
            } else if (parts.row < row && endRow >= row) {
              cell.dataset.rowspan = String(rowspan - 1);
            } else if (parts.row > row) {
              setCellPosition(cell, parts.col, parts.row - 1);
            }
          });
        rowHeights = Object.fromEntries(Object.entries(rowHeights)
          .filter(([key]) => Number(key) !== row)
          .map(([key, value]) => {
            const number = Number(key);
            return [number > row ? number - 1 : number, value];
          }));
        refreshCells();
        const targetRow = Math.min(row, Math.max(...getRows()));
        selectCell(getCell('A', targetRow) || root.querySelector('[data-cell]:not(.gray)'));
      }

      function addColumn(position = 'after') {
        if (!canEditTemplate()) return;
        if (!selectedCell) return;
        const index = Math.max(0, activeColIndex());
        const insertIndex = position === 'before' ? index : index + 1;
        const boundaryIndex = position === 'before' ? index - 1 : index;
        const targetRow = Number(rowOf(selectedCell));
        const detailLeft = detailTable ? columns.indexOf(detailTable.startColumn) : -1;
        const detailRight = detailTable ? columns.indexOf(detailTable.endColumn) : -1;
        const insideComponent = Boolean(detailTable && index >= detailLeft && index <= detailRight);
        adjustDetailTableForColumnInsert(insertIndex, insideComponent);
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => columnIndex(columnOf(b)) - columnIndex(columnOf(a)))
          .forEach((cell) => {
            const parts = cellParts(cell);
            const start = columnIndex(parts.col);
            const colspan = colSpanOf(cell);
            const end = start + colspan - 1;
            if (start >= insertIndex) setCellPosition(cell, columnLabel(start + 1), parts.row);
            else if (start <= boundaryIndex && end > boundaryIndex) cell.dataset.colspan = String(colspan + 1);
          });
        columns = buildColumns(columns.length + 1);
        getRows().forEach((row) => {
          if (!coveredBySpan(row, insertIndex)) sheet.appendChild(createCell(columnLabel(insertIndex), row, ''));
        });
        refreshCells();
        selectCell(getCell(columnLabel(insertIndex), targetRow));
      }

      function deleteColumn() {
        if (!canEditTemplate()) return;
        if (!selectedCell) return;
        if (columns.length <= 1) return;
        const index = activeColIndex();
        const targetRow = Number(rowOf(selectedCell));
        if (detailTable) {
          const detailLeft = columns.indexOf(detailTable.startColumn);
          const detailRight = columns.indexOf(detailTable.endColumn);
          if (index >= detailLeft && index <= detailRight && detailLeft === detailRight) {
            showToast('明细表组件至少保留一列，不能删除');
            return;
          }
          adjustDetailTableForColumnDelete(index);
        }
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => columnIndex(columnOf(a)) - columnIndex(columnOf(b)))
          .forEach((cell) => {
            const parts = cellParts(cell);
            const start = columnIndex(parts.col);
            const colspan = colSpanOf(cell);
            const end = start + colspan - 1;
            if (start === index) {
              if (colspan > 1) {
                cell.dataset.colspan = String(colspan - 1);
              } else {
                cell.remove();
              }
            } else if (start < index && end >= index) {
              cell.dataset.colspan = String(colspan - 1);
            } else if (start > index) {
              setCellPosition(cell, columnLabel(start - 1), parts.row);
            }
          });
        columns = buildColumns(columns.length - 1);
        refreshCells();
        selectCell(getCell(columnLabel(Math.min(index, columns.length - 1)), targetRow) || root.querySelector('[data-cell]:not(.gray)'));
      }

      function closeSheetContextMenu() {
        if (!sheetContextMenu) return;
        sheetContextMenu.classList.remove('is-open');
        sheetContextMenu.setAttribute('aria-hidden', 'true');
        sheetContextMenu.replaceChildren();
      }

      function createContextMenuButton(label, action, danger = false) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        if (danger) button.classList.add('danger');
        button.addEventListener('click', () => {
          action();
          closeSheetContextMenu();
        });
        return button;
      }

      function positionSheetContextMenu(event) {
        sheetContextMenu.style.left = '0px';
        sheetContextMenu.style.top = '0px';
        sheetContextMenu.classList.add('is-open');
        sheetContextMenu.setAttribute('aria-hidden', 'false');
        const rect = sheetContextMenu.getBoundingClientRect();
        const left = Math.max(8, Math.min(event.clientX, window.innerWidth - rect.width - 8));
        const top = Math.max(8, Math.min(event.clientY, window.innerHeight - rect.height - 8));
        sheetContextMenu.style.left = `${left}px`;
        sheetContextMenu.style.top = `${top}px`;
      }

      function openRowContextMenu(event, row) {
        if (!canEditTemplate() || printMode || event.target.closest('.row-resizer')) return;
        event.preventDefault();
        event.stopPropagation();
        selectRow(row);
        sheetContextMenu.replaceChildren(
          createContextMenuButton('上方插入行', () => addRow('before')),
          createContextMenuButton('下方插入行', () => addRow('after')),
          createContextMenuButton('删除当前行', deleteRow, true)
        );
        positionSheetContextMenu(event);
      }

      function openColumnContextMenu(event, col) {
        if (!canEditTemplate() || printMode || event.target.closest('.col-resizer')) return;
        event.preventDefault();
        event.stopPropagation();
        selectColumn(col);
        sheetContextMenu.replaceChildren(
          createContextMenuButton('左侧插入列', () => addColumn('before')),
          createContextMenuButton('右侧插入列', () => addColumn('after')),
          createContextMenuButton('删除当前列', deleteColumn, true)
        );
        positionSheetContextMenu(event);
      }

      function bindFields() {
        if (!canEditTemplate()) return;
        fields.forEach((field) => {
          if (field.dataset.bound === 'true') return;
          field.dataset.bound = 'true';
          field.addEventListener('dragstart', () => {
            draggedField = field;
          });
          field.addEventListener('dragend', () => {
            draggedField = null;
            cells.forEach((cell) => cell.classList.remove('drop-ready'));
          });
          field.addEventListener('click', () => putFieldIntoCell(field, selectedCell));
        });
      }

      async function loadFieldMetadata() {
        if (!canEditTemplate()) {
          if (fieldTree) fieldTree.replaceChildren();
          fields = [];
          return;
        }
        try {
          const metadata = await apiRequest(`/erp/print/fields?moduleKey=${encodeURIComponent(moduleKey)}`);
          renderFieldGroups(metadata);
        } catch (error) {
          if (fieldTree) {
            const empty = document.createElement('div');
            empty.className = 'field-empty';
            empty.textContent = '字段读取失败';
            fieldTree.replaceChildren(empty);
          }
          fields = [];
        }
      }

      async function loadPrintData() {
        if (!businessId) return;
        try {
          const params = new URLSearchParams({
            moduleKey,
            businessId: String(businessId),
          });
          if (itemOrderField && itemOrderDirection) {
            params.set('itemOrderField', itemOrderField);
            params.set('itemOrderDirection', itemOrderDirection);
          }
          if (preserveStockDecimals) params.set('decimalMode', 'string');
          printData = await apiRequest(`/erp/print/data?${params.toString()}`);
        } catch (error) {
          printData = null;
          showToast(error.message || '读取打印数据失败');
        }
      }

      async function initTemplate() {
        root.classList.toggle('is-print-mode', printMode);
        root.classList.toggle('is-print-preparing', printMode);
        if (formula) formula.readOnly = printMode;
        createBlankTemplate();
        bindFields();
        try {
          if (designMode) {
            await loadFieldMetadata();
            await loadTemplateList();
          }
          await restoreLastTemplate();
          if (designMode) renderTemplateOptions();
          await loadPrintData();
          updatePanel(selectedCell);
          if (printMode && businessId) {
            renderPreview();
          } else {
            root.classList.remove('is-print-preparing');
          }
        } catch (error) {
          if (!printMode) root.classList.remove('is-print-preparing');
          showToast(error.message || '初始化打印模板失败');
        }
      }

      function handlePaperPresetChange() {
        const size = normalizePaperSize(paperSizeSelect.value);
        const preset = paperPresets[size] || paperPresets.custom;
        applyPaperConfig({
          size,
          width: preset.width,
          height: preset.height,
        });
      }

      function handlePaperDimensionInput() {
        applyPaperConfig({
          size: 'custom',
          width: paperWidthInput.value,
          height: paperHeightInput.value,
        });
      }

      function handlePaperMarginInput(position, input) {
        applyPaperConfig({
          margins: {
            [position]: input.value,
          },
        });
      }

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        if (event.data?.source !== 'erp-print-template-parent') return;
        if (event.data?.type !== 'auth') return;
        parentAuth = event.data.payload || {};
        updateTemplateTitle();
        if (authReadyResolve) {
          authReadyResolve();
          authReadyResolve = null;
        }
      });

      search.addEventListener('input', () => {
        applyFieldSearch();
      });

      insertButton.addEventListener('click', () => {
        const firstVisibleField = fields.find((field) => field.style.display !== 'none');
        putFieldIntoCell(firstVisibleField, selectedCell);
      });
      detailInsertButton.addEventListener('click', insertStandardDetailTable);
      detailConvertButton.addEventListener('click', openSelectedDetailConversion);
      legacySelectButton.addEventListener('click', selectLegacyDetailCandidate);
      legacyConvertButton.addEventListener('click', convertLegacyDetailCandidate);
      closeDetailPanelButton.addEventListener('click', () => root.classList.remove('has-detail-panel'));
      applyDetailPropertiesButton.addEventListener('click', applyDetailProperties);
      removeDetailTableButton.addEventListener('click', removeDetailTable);
      cancelDetailConvertButton.addEventListener('click', () => {
        pendingDetailConversionBounds = null;
        closeModal(detailConvertModal);
      });
      confirmDetailConvertButton.addEventListener('click', confirmDetailConversion);
      detailConvertModal.addEventListener('click', (event) => {
        if (event.target !== detailConvertModal) return;
        pendingDetailConversionBounds = null;
        closeModal(detailConvertModal);
      });

      borderSelect.addEventListener('change', () => {
        if (borderSelect.value) applyBorder(borderSelect.value);
        borderSelect.value = '';
      });

      boldButton.addEventListener('click', toggleBold);
      alignButtons.forEach((button) => {
        button.addEventListener('click', () => applyTextAlignment(button.dataset.align || 'left'));
      });
      mergeButton.addEventListener('click', mergeCells);
      fontFamilySelect.addEventListener('change', applyFontFamily);
      fontSizeSelect.addEventListener('change', applyFontSize);
      formula.addEventListener('input', () => setCustomText(selectedCell, formula.value));
      previewButton.addEventListener('click', renderPreview);
      printPreviewButton.addEventListener('click', printCurrentTemplate);
      closePreviewButton.addEventListener('click', () => closeModal(previewModal));
      previewModal.addEventListener('click', (event) => {
        if (event.target === previewModal) closeModal(previewModal);
      });
      saveButton.addEventListener('click', saveCurrentTemplate);
      setDefaultButton.addEventListener('click', setCurrentTemplateDefault);
      deleteButton.addEventListener('click', deleteCurrentTemplate);
      templateSelect.addEventListener('change', async () => {
        if (!canEditTemplate()) return;
        try {
          await loadTemplateById(templateSelect.value);
          updatePanel(selectedCell);
        } catch (error) {
          showToast(error.message || '模板切换失败');
          renderTemplateOptions();
        }
      });
      saveAsButton.addEventListener('click', () => {
        templateNameInput.value = currentTemplateName === '默认模板' ? '采购订单模板副本' : `${currentTemplateName} 副本`;
        openModal(saveAsModal);
        templateNameInput.focus();
        templateNameInput.select();
      });
      cancelSaveAsButton.addEventListener('click', () => closeModal(saveAsModal));
      saveAsModal.addEventListener('click', (event) => {
        if (event.target === saveAsModal) closeModal(saveAsModal);
      });
      confirmSaveAsButton.addEventListener('click', async () => {
        const name = templateNameInput.value.trim();
        if (!name) {
          showToast('请填写模板名称');
          templateNameInput.focus();
          return;
        }
        try {
          await saveAsCurrentTemplate(name);
          showToast('模板已另存为');
          closeModal(saveAsModal);
        } catch (error) {
          showToast(error.message || '另存为失败');
        }
      });
      templateNameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') confirmSaveAsButton.click();
        if (event.key === 'Escape') closeModal(saveAsModal);
      });
      paperSizeSelect.addEventListener('change', handlePaperPresetChange);
      paperOrientationSelect.addEventListener('change', () => applyPaperConfig({ orientation: paperOrientationSelect.value }));
      paperWidthInput.addEventListener('input', handlePaperDimensionInput);
      paperHeightInput.addEventListener('input', handlePaperDimensionInput);
      paperMarginTopInput.addEventListener('input', () => handlePaperMarginInput('top', paperMarginTopInput));
      paperMarginRightInput.addEventListener('input', () => handlePaperMarginInput('right', paperMarginRightInput));
      paperMarginBottomInput.addEventListener('input', () => handlePaperMarginInput('bottom', paperMarginBottomInput));
      paperMarginLeftInput.addEventListener('input', () => handlePaperMarginInput('left', paperMarginLeftInput));
      window.addEventListener('afterprint', clearPrintDocument);
      window.addEventListener('keydown', handleTemplateShortcut);
      window.addEventListener('mouseup', endDragSelection);
      window.addEventListener('click', (event) => {
        if (sheetContextMenu && !sheetContextMenu.contains(event.target)) closeSheetContextMenu();
      });
      window.addEventListener('resize', closeSheetContextMenu);
      sheetScroll.addEventListener('scroll', closeSheetContextMenu);
      if (window.parent !== window) {
        window.parent.postMessage({ source: 'erp-print-template', type: 'ready-for-auth' }, window.location.origin);
      }
      applyPaperConfig();
      void initTemplate();
    })();
  </script>

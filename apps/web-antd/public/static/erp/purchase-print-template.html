      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function fieldDisplay(name) {
        return name ? '${' + name + '}' : '';
      }

      function templateTitle(name = currentTemplateName) {
        return `采购订单 / ${name || '默认模板'}`;
      }

      function normalizeTemplateId(id) {
        return id === null || id === undefined ? '' : String(id);
      }

      function updateTemplateTitle() {
        if (breadcrumb) breadcrumb.textContent = templateTitle();
        if (templateSelect) {
          const value = currentTemplateId && currentTemplateId !== 'default' ? normalizeTemplateId(currentTemplateId) : '';
          if (templateSelect.value !== value) templateSelect.value = value;
        }
        if (setDefaultButton) {
          const hasSavedTemplate = currentTemplateId && currentTemplateId !== 'default';
          setDefaultButton.disabled = !canEditTemplate() || !hasSavedTemplate || currentTemplateDefaulted;
          setDefaultButton.textContent = currentTemplateDefaulted ? '默认模板' : '设为默认';
        }
        if (deleteButton) {
          const hasSavedTemplate = currentTemplateId && currentTemplateId !== 'default';
          deleteButton.hidden = !canDeleteTemplate();
          deleteButton.disabled = !hasSavedTemplate || currentTemplateDefaulted;
          deleteButton.title = currentTemplateDefaulted ? '默认模板不能删除，请先将其他模板设为默认' : '';
        }
      }

      function renderTemplateOptions() {
        if (!templateSelect) return;
        templateSelect.replaceChildren();
        if (!availableTemplates.length) {
          const emptyOption = document.createElement('option');
          emptyOption.value = '';
          emptyOption.textContent = '空白模板';
          templateSelect.appendChild(emptyOption);
        }
        availableTemplates.forEach((template) => {
          const option = document.createElement('option');
          option.value = normalizeTemplateId(template.id);
          option.textContent = `${template.name || '未命名模板'}${template.defaulted ? '（默认）' : ''}`;
          templateSelect.appendChild(option);
        });
        const currentId = normalizeTemplateId(currentTemplateId);
        if (currentId && currentTemplateId !== 'default' && !availableTemplates.some((item) => normalizeTemplateId(item.id) === currentId)) {
          const currentOption = document.createElement('option');
          currentOption.value = currentId;
          currentOption.textContent = currentTemplateName || '当前模板';
          templateSelect.appendChild(currentOption);
        }
        updateTemplateTitle();
      }

      function showToast(message) {
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('is-open');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('is-open'), 1800);
      }

      function mmToPx(value) {
        return Math.round((Number(value) || 0) * paperPxPerMm);
      }

      function clampMm(value, min, max, fallback) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.min(max, Math.max(min, number));
      }

      function normalizePaperSize(value) {
        return paperPresets[value] ? value : 'custom';
      }

      function paperSizeInMm() {
        const width = clampMm(paperConfig.width, 50, 500, paperPresets.A4.width);
        const height = clampMm(paperConfig.height, 50, 500, paperPresets.A4.height);
        return paperConfig.orientation === 'landscape'
          ? { width: height, height: width }
          : { width, height };
      }

      function updatePrintPageStyle(size) {
        const margin = paperConfig.margins;
        printPageStyle.textContent = [
          '@page {',
          `  size: ${size.width}mm ${size.height}mm;`,
          `  margin: ${margin.top}mm ${margin.right}mm ${margin.bottom}mm ${margin.left}mm;`,
          '}',
        ].join('\n');
      }

      function createPaperRenderPage(sheetNode, pageClassName) {
        const size = paperSizeInMm();
        const margin = paperConfig.margins;
        const page = document.createElement('div');
        page.className = pageClassName;
        page.dataset.paperSize = `${size.width} x ${size.height}mm`;
        page.dataset.paperOrientation = paperConfig.orientation;
        page.style.width = `${mmToPx(size.width)}px`;
        page.style.height = `${mmToPx(size.height)}px`;
        page.style.padding = [
          `${mmToPx(margin.top)}px`,
          `${mmToPx(margin.right)}px`,
          `${mmToPx(margin.bottom)}px`,
          `${mmToPx(margin.left)}px`,
        ].join(' ');
        page.appendChild(sheetNode);
        return page;
      }

      function syncPaperControls(size) {
        if (paperSizeSelect) paperSizeSelect.value = paperConfig.size;
        if (paperOrientationSelect) paperOrientationSelect.value = paperConfig.orientation;
        if (paperWidthInput) paperWidthInput.value = String(paperConfig.width);
        if (paperHeightInput) paperHeightInput.value = String(paperConfig.height);
        if (paperMarginTopInput) paperMarginTopInput.value = String(paperConfig.margins.top);
        if (paperMarginRightInput) paperMarginRightInput.value = String(paperConfig.margins.right);
        if (paperMarginBottomInput) paperMarginBottomInput.value = String(paperConfig.margins.bottom);
        if (paperMarginLeftInput) paperMarginLeftInput.value = String(paperConfig.margins.left);
        if (paperReadout) paperReadout.textContent = `当前画布 ${size.width} x ${size.height}mm`;
      }

      function applyPaperConfig(nextConfig = {}) {
        if (nextConfig.size) paperConfig.size = normalizePaperSize(nextConfig.size);
        const preset = paperPresets[paperConfig.size] || paperPresets.custom;
        if (nextConfig.size && nextConfig.size !== 'custom' && nextConfig.width === undefined && nextConfig.height === undefined) {
          paperConfig.width = preset.width;
          paperConfig.height = preset.height;
        }
        if (nextConfig.width !== undefined) paperConfig.width = clampMm(nextConfig.width, 50, 500, preset.width);
        if (nextConfig.height !== undefined) paperConfig.height = clampMm(nextConfig.height, 50, 500, preset.height);
        if (nextConfig.orientation) paperConfig.orientation = nextConfig.orientation === 'landscape' ? 'landscape' : 'portrait';
        if (nextConfig.margins) {
          paperConfig.margins = {
            ...paperConfig.margins,
            ...Object.fromEntries(Object.entries(nextConfig.margins).map(([key, value]) => [key, clampMm(value, 0, 80, paperConfig.margins[key] || 0)])),
          };
        }
        const size = paperSizeInMm();
        root.style.setProperty('--paper-width', `${mmToPx(size.width)}px`);
        root.style.setProperty('--paper-height', `${mmToPx(size.height)}px`);
        root.style.setProperty('--paper-margin-top', `${mmToPx(paperConfig.margins.top)}px`);
        root.style.setProperty('--paper-margin-right', `${mmToPx(paperConfig.margins.right)}px`);
        root.style.setProperty('--paper-margin-bottom', `${mmToPx(paperConfig.margins.bottom)}px`);
        root.style.setProperty('--paper-margin-left', `${mmToPx(paperConfig.margins.left)}px`);
        if (paperPage) paperPage.dataset.orientation = paperConfig.orientation;
        updatePrintPageStyle(size);
        syncPaperControls(size);
      }

      function parseJson(value) {
        if (!value || typeof value !== 'string') return null;
        try {
          return JSON.parse(value);
        } catch (error) {
          return null;
        }
      }

      function normalizeAccessStore(value) {
        if (!value || typeof value !== 'object') return null;
        if (value.accessToken) return value;
        if (value.state && value.state.accessToken) return value.state;
        return null;
      }

      function readAccessStore() {
        const fromParent = normalizeAccessStore(parentAuth);
        if (fromParent) return fromParent;
        const direct = normalizeAccessStore(parseJson(localStorage.getItem('core-access')));
        if (direct) return direct;
        for (let index = 0; index < localStorage.length; index += 1) {
          const key = localStorage.key(index);
          const value = normalizeAccessStore(parseJson(localStorage.getItem(key)));
          if (value) return value;
        }
        return {};
      }

      function apiHeaders(accessStore = readAccessStore()) {
        const headers = {
          'Content-Type': 'application/json',
          'Accept-Language': navigator.language || 'zh-CN',
        };
        if (accessStore.accessToken) headers.Authorization = `Bearer ${accessStore.accessToken}`;
        if (accessStore.tenantId) headers['tenant-id'] = String(accessStore.tenantId);
        if (accessStore.visitTenantId) headers['visit-tenant-id'] = String(accessStore.visitTenantId);
        return headers;
      }

      function waitForParentAuth(timeout = 5000) {
        if (readAccessStore().accessToken || window.parent === window) return Promise.resolve();
        window.parent.postMessage({ source: 'erp-print-template', type: 'ready-for-auth' }, window.location.origin);
        return Promise.race([
          authReady,
          new Promise((resolve) => window.setTimeout(resolve, timeout)),
        ]);
      }

      async function apiRequest(path, options = {}) {
        await waitForParentAuth();
        const accessStore = readAccessStore();
        if (!accessStore.accessToken) {
          throw new Error('登录信息同步失败，请关闭后重新打开打印模板');
        }
        const response = await fetch(`/admin-api${path}`, {
          ...options,
          headers: {
            ...apiHeaders(accessStore),
            ...(options.headers || {}),
          },
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload || payload.code !== 0) {
          const message = payload && (payload.msg || payload.message) ? (payload.msg || payload.message) : '接口请求失败';
          throw new Error(message);
        }
        return payload.data;
      }

      async function apiBlobRequest(path, options = {}) {
        await waitForParentAuth();
        const accessStore = readAccessStore();
        if (!accessStore.accessToken) {
          throw new Error('登录信息同步失败，请关闭后重新打开打印模板');
        }
        const response = await fetch(`/admin-api${path}`, {
          ...options,
          headers: {
            ...apiHeaders(accessStore),
            ...(options.headers || {}),
          },
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => null);
          throw new Error((payload && (payload.msg || payload.message)) || '字体资源加载失败');
        }
        return response.blob();
      }

      async function loadPrintFontFace(fontFamily, weight, cssFamily = `ErpPrint-${fontFamily}`) {
        const cacheKey = `${cssFamily}:${weight}`;
        if (loadedFontFaces.has(cacheKey)) return loadedFontFaces.get(cacheKey);
        const loading = (async () => {
          if (!window.FontFace || !document.fonts) {
            throw new Error('当前浏览器不支持内置打印字体，请更换浏览器后重试');
          }
          const blob = await apiBlobRequest(`/erp/print/font/file?fontFamily=${encodeURIComponent(fontFamily)}&weight=${weight}`);
          const blobUrl = URL.createObjectURL(blob);
          try {
            const face = new FontFace(cssFamily, `url(${blobUrl})`, { style: 'normal', weight: String(weight) });
            await face.load();
            document.fonts.add(face);
            return face;
          } finally {
            URL.revokeObjectURL(blobUrl);
          }
        })();
        loadedFontFaces.set(cacheKey, loading);
        try {
          return await loading;
        } catch (error) {
          loadedFontFaces.delete(cacheKey);
          throw error;
        }
      }

      async function ensurePrintFontsLoaded() {
        const fontFamilies = new Set(['microsoft_yahei']);
        root.querySelectorAll('[data-cell][data-font-family]').forEach((cell) => {
          const fontFamily = normalizeFontFamily(cell.dataset.fontFamily);
          if (fontFamily) fontFamilies.add(fontFamily);
        });
        const loads = [
          loadPrintFontFace('microsoft_yahei', 400, 'ErpPrintFallback'),
          loadPrintFontFace('microsoft_yahei', 700, 'ErpPrintFallback'),
        ];
        fontFamilies.forEach((fontFamily) => {
          loads.push(loadPrintFontFace(fontFamily, 400));
          loads.push(loadPrintFontFace(fontFamily, 700));
        });
        await Promise.all(loads);
        await document.fonts.ready;
      }

      function normalizeFieldCode(code) {
        const raw = String(code || '').trim();
        const stripped = raw.replace(/^\$\{/, '').replace(/\}$/, '');
        return legacyCodeMap[stripped] !== undefined ? legacyCodeMap[stripped] : stripped;
      }

      function displayCode(code) {
        const normalized = normalizeFieldCode(code);
        return normalized || '';
      }

      function isAmountPrintFieldCode(code) {
        const normalized = normalizeFieldCode(code);
        const fieldName = normalized.slice(normalized.lastIndexOf('.') + 1);
        if (/(?:rate|ratio|percent|percentage|coefficient)\d*$/i.test(fieldName)) return false;
        return fieldName.toLowerCase() === 'tax'
          || /(?:price|amount|cost|debt|receivable|payable|balance|advance|fee|freight|profit|fund|revenue|settled|settlement|payment|receipt|income|expense|credit|debit|assets?)\d*$/i.test(fieldName);
      }

      function formatPrintValue(code, value) {
        if (value === undefined || value === null || value === '') return '';
        if (preserveStockDecimals) {
          const field = normalizeFieldCode(code).split('.').pop() || '';
          if (isAmountPrintFieldCode(code) || /(?:count|quantity|qty|weight)\d*$/i.test(field)) {
            const text = String(value);
            if (/^-?\d+(?:\.\d+)?$/.test(text)) {
              const natural = text.includes('.') ? text.replace(/(\.\d*?[1-9])0+$|\.0+$/,'$1') : text;
              if (!isAmountPrintFieldCode(code)) return natural;
              const parts = natural.split('.');
              return parts[0]+'.'+(parts[1] || '').padEnd(2,'0');
            }
          }
          return value;
        }
        if (!isAmountPrintFieldCode(code)) return value;
        const numericValue = Number(value);
        return Number.isFinite(numericValue) ? numericValue.toFixed(2) : value;
      }

      function resolvePrintValue(code, itemIndex = 0, pageContext = null) {
        const normalized = normalizeFieldCode(code);
        if (!normalized || !printData) return '';
        if (normalized === 'print.pageNo') return pageContext?.pageNo ?? '';
        if (normalized === 'print.pageCount') return pageContext?.pageCount ?? '';
        if (normalized === 'print.pageText') {
          return pageContext ? `第${pageContext.pageNo}页/共${pageContext.pageCount}页` : '';
        }
        if (normalized.startsWith('items.')) {
          const row = (printData.items || [])[itemIndex] || {};
          return formatPrintValue(normalized, row[normalized] ?? '');
        }
        const value = (printData.main && printData.main[normalized])
          ?? (printData.system && printData.system[normalized])
          ?? '';
        return formatPrintValue(normalized, value);
      }

      function fieldCodeByName(name) {
        const normalizedName = String(name || '').trim();
        if (!normalizedName) return '';
        const definition = fieldDefinitions.find((item) => (item.name || '').trim() === normalizedName);
        if (definition) return normalizeFieldCode(definition.code);
        const field = fields.find((item) => (item.dataset.name || '').trim() === normalizedName);
        if (field) return normalizeFieldCode(field.dataset.code);
        return normalizeFieldCode(fallbackFieldCodeByNameMap[normalizedName]);
      }

      function resolvePlaceholderCode(raw, placeholderCodes = {}) {
        const normalized = normalizeFieldCode(raw);
        if (!normalized) return '';
        if (placeholderCodes[normalized]) return normalizeFieldCode(placeholderCodes[normalized]);
        const codeByName = fieldCodeByName(normalized);
        if (codeByName) return codeByName;
        return normalized.includes('.') || legacyCodeMap[normalized] !== undefined ? normalized : '';
      }

      function placeholderCodeMap(html, preferredCodes = {}) {
        const map = {};
        const matches = String(html || '').matchAll(/\$\{\s*([^}]+?)\s*\}/g);
        for (const match of matches) {
          const raw = String(match[1] || '').trim();
          const code = resolvePlaceholderCode(raw, preferredCodes);
          if (raw && code && code !== raw) map[raw] = code;
        }
        return map;
      }

      function storedPlaceholderCodes(cell) {
        try {
          const value = JSON.parse(cell?.dataset.placeholderCodes || '{}');
          return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
        } catch (error) {
          return {};
        }
      }

      function cellPlaceholderCodeMap(cell, html = cell?.innerHTML || '') {
        const preferredCodes = { ...storedPlaceholderCodes(cell) };
        const name = String(cell?.dataset.name || '').trim();
        const code = normalizeFieldCode(cell?.dataset.code);
        if (name && code) preferredCodes[name] = code;
        return placeholderCodeMap(html, preferredCodes);
      }

      function stripFieldTokenSpans(html) {
        return String(html || '').replace(
          /<span\b([^>]*)class=(["'])(?=[^"']*\btoken\b)[^"']*\2([^>]*)>([\s\S]*?)<\/span>/gi,
          '$4',
        );
      }

      function renderFieldPlaceholders(html, itemIndex = 0, placeholderCodes = {}, pageContext = null) {
        const rendered = String(html || '').replace(/\$\{\s*([^}]+?)\s*\}/g, (match, raw) => {
          const code = resolvePlaceholderCode(raw, placeholderCodes);
          if (!code) return match;
          const value = resolvePrintValue(code, itemIndex, pageContext);
          return escapeHtml(value === undefined || value === null ? '' : value);
        });
        return stripFieldTokenSpans(rendered);
      }

      function hasItemPlaceholder(html, placeholderCodes = {}) {
        const matches = String(html || '').matchAll(/\$\{\s*([^}]+?)\s*\}/g);
        for (const match of matches) {
          if (resolvePlaceholderCode(match[1], placeholderCodes).startsWith('items.')) return true;
        }
        return false;
      }

      function notifyPrinted() {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ source: 'erp-print-template', type: 'printed' }, window.location.origin);
        }
      }

      function canEditTemplate() {
        return designMode;
      }

      function canDeleteTemplate() {
        const accessCodes = readAccessStore().accessCodes;
        return designMode && Array.isArray(accessCodes) && accessCodes.includes(printTemplateDeletePermission);
      }

      function cacheFieldDefinitions(metadata) {
        if (!metadata || !Array.isArray(metadata.groups)) {
          fieldDefinitions = [];
          detailFieldDefinitions = [];
          return;
        }
        fieldDefinitions = metadata.groups.flatMap((group) =>
          (Array.isArray(group.fields) ? group.fields : []).map((field) => ({
            name: field.name || '',
            code: normalizeFieldCode(field.code),
            groupKey: group.key || '',
          }))
        );
        detailFieldDefinitions = fieldDefinitions.filter((field) => field.groupKey === 'detail' || fieldCodeIsDetail(field.code));
      }

      function renderFieldGroups(metadata) {
        cacheFieldDefinitions(metadata);
        if (!fieldTree || !metadata || !Array.isArray(metadata.groups)) return;
        const groups = metadata.groups.map((group) => {
          const section = document.createElement('section');
          section.className = 'field-group';
          section.dataset.fieldGroup = group.key || '';
          const groupFields = Array.isArray(group.fields) ? group.fields : [];
          const list = document.createElement('div');
          list.className = 'field-list';
          list.replaceChildren(...groupFields.map((field) => {
            const item = document.createElement('div');
            item.className = 'field-item';
            item.draggable = true;
            item.title = `${field.name || ''} ${displayCode(field.code)}`.trim();
            item.dataset.name = field.name || '';
            item.dataset.code = normalizeFieldCode(field.code);
            item.dataset.source = field.source || group.name || '';
            item.dataset.group = group.key || '';
            item.innerHTML = `<span class="field-name">${escapeHtml(field.name || '')}</span><span class="field-code">${escapeHtml(displayCode(field.code))}</span>`;
            return item;
          }));
          const head = document.createElement('button');
          head.className = 'field-group__head';
          head.type = 'button';
          const groupName = group.name || group.label || '';
          const groupTarget = group.target || group.hint || '';
          head.innerHTML = `
            <span class="field-group__arrow">⌄</span>
            <span class="field-group__name" title="${escapeHtml(groupName)}">${escapeHtml(groupName)}</span>
            <span class="field-group__hint" title="${escapeHtml(groupTarget)}">${escapeHtml(groupTarget)}</span>
            <span class="field-group__count">${groupFields.length}</span>
          `;
          head.addEventListener('click', () => {
            section.classList.toggle('is-collapsed');
          });
          section.replaceChildren(head, list);
          return section;
        });
        fieldTree.replaceChildren(...groups);
        fields = Array.from(root.querySelectorAll('.field-item'));
        bindFields();
        applyFieldSearch();
        updateDetailUi();
      }

      function applyFieldSearch() {
        const keyword = search.value.trim().toLowerCase();
        let totalVisible = 0;
        root.querySelectorAll('.field-group').forEach((group) => {
          let visibleCount = 0;
          group.querySelectorAll('.field-item').forEach((field) => {
            const text = `${field.dataset.name} ${field.dataset.code}`.toLowerCase();
            const visible = !keyword || text.includes(keyword);
            field.style.display = visible ? '' : 'none';
            if (visible) visibleCount += 1;
          });
          totalVisible += visibleCount;
          group.style.display = visibleCount ? '' : 'none';
          if (keyword && visibleCount) group.classList.remove('is-collapsed');
        });
        if (fieldTree) {
          let empty = fieldTree.querySelector('.field-empty');
          if (!empty) {
            empty = document.createElement('div');
            empty.className = 'field-empty';
            fieldTree.appendChild(empty);
          }
          empty.textContent = keyword ? '没有匹配字段' : '暂无字段';
          empty.style.display = totalVisible ? 'none' : '';
        }
      }

      function cellDisplay(cell) {
        return cell.dataset.name ? fieldDisplay(cell.dataset.name) : cell.textContent.trim();
      }

      function cellParts(cell) {
        const id = cell.dataset.cell || 'A1';
        const match = id.match(/^([A-Z]+)(\d+)$/);
        return match ? { col: match[1], row: Number(match[2]) } : { col: 'A', row: 1 };
      }

      function columnOf(cell) {
        return cellParts(cell).col;
      }

      function rowOf(cell) {
        return String(cellParts(cell).row);
      }

      function columnLabel(index) {
        let next = index;
        let label = '';
        do {
          label = String.fromCharCode(65 + (next % 26)) + label;
          next = Math.floor(next / 26) - 1;
        } while (next >= 0);
        return label;
      }

      function buildColumns(count) {
        return Array.from({ length: count }, (_, index) => columnLabel(index));
      }

      function expandColumnsForPaper(savedColumns, minimumCount = 18) {
        const nextColumns = Array.isArray(savedColumns) && savedColumns.length ? [...savedColumns] : [];
        const seen = new Set(nextColumns);
        for (let index = 0; nextColumns.length < minimumCount; index += 1) {
          const label = columnLabel(index);
          if (!seen.has(label)) {
            nextColumns.push(label);
            seen.add(label);
          }
        }
        return nextColumns.length ? nextColumns : buildColumns(minimumCount);
      }

      function columnIndex(col) {
        return columns.indexOf(col);
      }

      function parseCellId(cellId) {
        const match = String(cellId || '').match(/^([A-Z]+)(\d+)$/);
        return match ? { col: match[1], row: Number(match[2]) } : { col: '', row: 0 };
      }

      function normalizeDetailRowRange(range, required = false) {
        if (!range || typeof range !== 'object') return required ? null : null;
        const rawStart = Number(range.start);
        const rawEnd = Number(range.end);
        if (!Number.isInteger(rawStart) || !Number.isInteger(rawEnd) || rawStart < 1 || rawEnd < rawStart) {
          return required ? null : null;
        }
        return { start: rawStart, end: rawEnd };
      }

      function normalizeDetailTable(value) {
        if (!value || typeof value !== 'object') return null;
        const startColumn = String(value.startColumn || '').toUpperCase();
        const endColumn = String(value.endColumn || '').toUpperCase();
        const startIndex = columns.indexOf(startColumn);
        const endIndex = columns.indexOf(endColumn);
        const bodyRows = normalizeDetailRowRange(value.bodyRows, true);
        if (startIndex < 0 || endIndex < startIndex || !bodyRows) return null;
        const headerRows = normalizeDetailRowRange(value.headerRows);
        const footerRows = normalizeDetailRowRange(value.footerRows);
        if ((value.headerRows && !headerRows) || (value.footerRows && !footerRows)) return null;
        if ((headerRows && headerRows.end + 1 !== bodyRows.start)
          || (footerRows && footerRows.start !== bodyRows.end + 1)) return null;
        return {
          id: 'detail-table',
          dataSource: 'items',
          startColumn,
          endColumn,
          headerRows,
          bodyRows,
          footerRows,
          repeatHeader: value.repeatHeader !== false,
        };
      }

      function cloneDetailTable(value = detailTable) {
        if (!value) return null;
        return {
          id: 'detail-table',
          dataSource: 'items',
          startColumn: value.startColumn,
          endColumn: value.endColumn,
          headerRows: value.headerRows ? { ...value.headerRows } : null,
          bodyRows: { ...value.bodyRows },
          footerRows: value.footerRows ? { ...value.footerRows } : null,
          repeatHeader: value.repeatHeader !== false,
        };
      }

      function detailComponentStartRow(table = detailTable) {
        if (!table) return 0;
        return table.headerRows?.start || table.bodyRows.start;
      }

      function detailComponentEndRow(table = detailTable) {
        if (!table) return 0;
        return table.footerRows?.end || table.bodyRows.end;
      }

      function detailSectionForPosition(row, colIndex, table = detailTable) {
        if (!table) return 'outside';
        const left = columns.indexOf(table.startColumn);
        const right = columns.indexOf(table.endColumn);
        if (colIndex < left || colIndex > right) return 'outside';
        if (table.headerRows && row >= table.headerRows.start && row <= table.headerRows.end) return 'header';
        if (row >= table.bodyRows.start && row <= table.bodyRows.end) return 'body';
        if (table.footerRows && row >= table.footerRows.start && row <= table.footerRows.end) return 'footer';
        return 'outside';
      }

      function cellFullyInDetailSection(cell, section, table = detailTable) {
        if (!cell || !table) return false;
        const rect = cellRect(cell);
        for (let row = rect.top; row <= rect.bottom; row += 1) {
          for (let col = rect.left; col <= rect.right; col += 1) {
            if (detailSectionForPosition(row, col, table) !== section) return false;
          }
        }
        return true;
      }

      function cellIntersectsDetailSection(cell, section, table = detailTable) {
        if (!cell || !table) return false;
        const rect = cellRect(cell);
        for (let row = rect.top; row <= rect.bottom; row += 1) {
          for (let col = rect.left; col <= rect.right; col += 1) {
            if (detailSectionForPosition(row, col, table) === section) return true;
          }
        }
        return false;
      }

      function fieldCodeIsDetail(code) {
        return normalizeFieldCode(code).startsWith('items.');
      }

      function itemCodesFromDataCell(item) {
        const codes = new Set();
        const directCode = normalizeFieldCode(item?.code);
        if (directCode) codes.add(directCode);
        Object.values(item?.placeholderCodes || {}).forEach((code) => {
          const normalized = normalizeFieldCode(code);
          if (normalized) codes.add(normalized);
        });
        const html = String(item?.html || '');
        for (const match of html.matchAll(/\$\{\s*([^}]+?)\s*\}/g)) {
          const normalized = resolvePlaceholderCode(match[1], item?.placeholderCodes || {});
          if (normalized) codes.add(normalized);
        }
        return Array.from(codes);
      }

      function validateExplicitDetailTable(data, markInvalid = false) {
        if (markInvalid) root.querySelectorAll('.detail-invalid').forEach((cell) => cell.classList.remove('detail-invalid'));
        if (Number(data?.version) < 2) return [];
        const table = normalizeDetailTable(data.detailTable);
        const errors = [];
        if (data.detailTable && !table) return ['明细表组件范围无效'];
        if (table && detailComponentEndRow(table) > Math.max(1, Number(data.rowCount) || 1)) {
          errors.push('明细表组件行范围超出模板');
        }
        if (table && detailTableHasCrossBoundaryMerge(table)) {
          errors.push('明细表组件存在跨区或跨边界合并单元格');
        }
        const mark = (cellId) => {
          if (!markInvalid) return;
          const cell = root.querySelector(`[data-cell="${cellId}"]`);
          if (cell) cell.classList.add('detail-invalid');
        };
        (data.cells || []).forEach((item) => {
          const codes = itemCodesFromDataCell(item);
          if (!codes.length) return;
          const parts = parseCellId(item.cell);
          const col = columns.indexOf(parts.col);
          const colspan = Math.max(1, Number(item.colspan) || 1);
          const rowspan = Math.max(1, Number(item.rowspan) || 1);
          const sections = new Set();
          for (let row = parts.row; row < parts.row + rowspan; row += 1) {
            for (let index = col; index < col + colspan; index += 1) {
              sections.add(detailSectionForPosition(row, index, table));
            }
          }
          const hasDetail = codes.some(fieldCodeIsDetail);
          const hasMain = codes.some((code) => !fieldCodeIsDetail(code));
          if (hasDetail && (sections.size !== 1 || !sections.has('body'))) {
            errors.push(`${item.cell} 的明细字段位于循环体外`);
            mark(item.cell);
          }
          if (hasMain && sections.has('body')) {
            errors.push(`${item.cell} 的主表或系统字段位于循环体内`);
            mark(item.cell);
          }
        });
        return errors;
      }

      function canPlaceFieldInCell(field, cell) {
        if (!field || !cell || templateVersion < 2) return true;
        const detailField = fieldCodeIsDetail(field.dataset.code);
        if (detailField) return Boolean(detailTable && cellFullyInDetailSection(cell, 'body'));
        return !detailTable || !cellIntersectsDetailSection(cell, 'body');
      }

      function detailPlacementMessage(field, cell) {
        const location = cell?.dataset.cell || '当前单元格';
        return fieldCodeIsDetail(field?.dataset.code)
          ? `明细字段只能放在明细表组件的循环体内（${location}）`
          : `主表和系统字段不能放在明细表组件的循环体内（${location}）`;
      }

      function detailRangeContainsCell(cell, table = detailTable) {
        if (!cell || !table) return false;
        const rect = cellRect(cell);
        const left = columns.indexOf(table.startColumn);
        const right = columns.indexOf(table.endColumn);
        return rect.left <= right && rect.right >= left
          && rect.top <= detailComponentEndRow(table) && rect.bottom >= detailComponentStartRow(table);
      }

      function refreshDetailTableDecorations() {
        const classes = [
          'detail-component-cell', 'detail-component-header', 'detail-component-body', 'detail-component-footer',
          'detail-component-top', 'detail-component-bottom', 'detail-component-left', 'detail-component-right',
          'detail-component-start'
        ];
        root.querySelectorAll('[data-cell]').forEach((cell) => cell.classList.remove(...classes));
        if (!detailTable || printMode) return;
        const left = columns.indexOf(detailTable.startColumn);
        const right = columns.indexOf(detailTable.endColumn);
        const top = detailComponentStartRow();
        const bottom = detailComponentEndRow();
        root.querySelectorAll('[data-cell]').forEach((cell) => {
          const rect = cellRect(cell);
          if (rect.right < left || rect.left > right || rect.bottom < top || rect.top > bottom) return;
          cell.classList.add('detail-component-cell');
          const section = detailSectionForPosition(rect.top, rect.left);
          if (section !== 'outside') cell.classList.add(`detail-component-${section}`);
          if (rect.top === top) cell.classList.add('detail-component-top');
          if (rect.bottom === bottom) cell.classList.add('detail-component-bottom');
          if (rect.left === left) cell.classList.add('detail-component-left');
          if (rect.right === right) cell.classList.add('detail-component-right');
          if (rect.top === top && rect.left === left) cell.classList.add('detail-component-start');
        });
      }

      function updateDetailColumnOptions() {
        [detailStartColumnInput, detailEndColumnInput].forEach((select) => {
          const current = select.value;
          select.replaceChildren(...columns.map((column) => {
            const option = document.createElement('option');
            option.value = column;
            option.textContent = column;
            return option;
          }));
          select.value = columns.includes(current) ? current : columns[0];
        });
      }

      function updateDetailPanel() {
        const selectedInside = detailTable && selectedCell && detailRangeContainsCell(selectedCell);
        root.classList.toggle('has-detail-panel', Boolean(selectedInside));
        if (!selectedInside) return;
        updateDetailColumnOptions();
        detailStartColumnInput.value = detailTable.startColumn;
        detailEndColumnInput.value = detailTable.endColumn;
        detailHeaderStartInput.value = detailTable.headerRows?.start || 0;
        detailHeaderEndInput.value = detailTable.headerRows?.end || 0;
        detailBodyStartInput.value = detailTable.bodyRows.start;
        detailBodyEndInput.value = detailTable.bodyRows.end;
        detailFooterStartInput.value = detailTable.footerRows?.start || 0;
        detailFooterEndInput.value = detailTable.footerRows?.end || 0;
        detailRepeatHeaderInput.checked = detailTable.repeatHeader !== false;
      }

      function legacyDetailCandidate() {
        if (templateVersion >= 2) return null;
        const data = serializeTemplate();
        const blocks = detailBlocks(data);
        if (blocks.length !== 1) return { blocks, bounds: null };
        const block = blocks[0];
        const headerRows = detectDetailHeaderRows(data, blocks);
        const relevantRows = new Set([...headerRows]);
        for (let row = block.start; row <= block.end; row += 1) relevantRows.add(row);
        const relevantCells = (data.cells || []).filter((item) => {
          const range = cellRowRange(item);
          return Array.from(relevantRows).some((row) => range.start <= row && row <= range.end) && isRenderablePrintCell(root.querySelector(`[data-cell="${item.cell}"]`), item);
        });
        const indexes = relevantCells.flatMap((item) => {
          const parts = parseCellId(item.cell);
          const start = columns.indexOf(parts.col);
          return [start, start + Math.max(1, Number(item.colspan) || 1) - 1];
        }).filter((index) => index >= 0);
        if (!indexes.length) return { blocks, bounds: null };
        return {
          blocks,
          bounds: {
            left: Math.min(...indexes),
            right: Math.max(...indexes),
            top: headerRows.length ? Math.min(...headerRows) : block.start,
            bottom: block.end,
          },
          bodyStart: block.start,
          bodyEnd: block.end,
        };
      }

      function updateDetailUi() {
        const hasDetailFields = detailFieldDefinitions.length > 0;
        detailInsertButton.disabled = Boolean(detailTable) || !hasDetailFields;
        detailConvertButton.disabled = Boolean(detailTable);
        detailInsertButton.title = detailTable ? '每个模板只能存在一个明细表组件' : (!hasDetailFields ? '当前模块没有可用明细字段' : '插入标准明细表组件');
        detailConvertButton.title = detailTable ? '每个模板只能存在一个明细表组件' : '把当前矩形选区转换为明细表组件';
        const candidate = legacyDetailCandidate();
        legacyDetailBanner.classList.toggle('is-visible', Boolean(candidate?.blocks?.length));
        if (candidate?.blocks?.length > 1) {
          legacyDetailMessage.textContent = `检测到 ${candidate.blocks.length} 个旧版明细区域，请选择正确区域后转换；不转换仍可按旧版打印。`;
          legacySelectButton.disabled = true;
          legacyConvertButton.disabled = true;
        } else if (candidate?.bounds) {
          legacyDetailMessage.textContent = '检测到一个旧版明细区域，已可定位并转换；不转换仍可按旧版打印。';
          legacySelectButton.disabled = false;
          legacyConvertButton.disabled = false;
        }
        refreshDetailTableDecorations();
        updateDetailPanel();
      }

      function nextColumnLabel() {
        return columnLabel(columns.length);
      }

      function parseSpan(value) {
        const match = String(value || '').match(/span\s+(\d+)/);
        return match ? Number(match[1]) : 1;
      }

      function colSpanOf(cell) {
        const value = Number(cell.dataset.colspan) || parseSpan(cell.style.gridColumn);
        cell.dataset.colspan = String(Math.max(1, value));
        return Number(cell.dataset.colspan);
      }

      function rowSpanOf(cell) {
        const value = Number(cell.dataset.rowspan) || parseSpan(cell.style.gridRow);
        cell.dataset.rowspan = String(Math.max(1, value));
        return Number(cell.dataset.rowspan);
      }

      function setCellPosition(cell, col, row) {
        cell.dataset.cell = `${col}${row}`;
      }

      function getRows() {
        const rows = new Set();
        root.querySelectorAll('[data-cell]').forEach((cell) => {
          const startRow = Number(rowOf(cell));
          const rowspan = rowSpanOf(cell);
          for (let row = startRow; row < startRow + rowspan; row += 1) {
            rows.add(row);
          }
        });
        return Array.from(rows).filter(Boolean).sort((a, b) => a - b);
      }

      function getMaxRow() {
        return Math.max(...getRows(), 20);
      }

      function renderColumnHeads() {
        root.querySelectorAll('.col-head').forEach((head) => head.remove());
        columns.forEach((col) => {
          const head = document.createElement('div');
          head.className = 'col-head';
          head.dataset.col = col;
          head.innerHTML = `${col}<span class="col-resizer" data-col-resize="${col}"></span>`;
          sheet.appendChild(head);
        });
      }

      function renderRowHeads() {
        root.querySelectorAll('.row-head').forEach((head) => head.remove());
        getRows().forEach((row) => {
          const head = createRowHead(row);
          if (rowHeights[row]) head.style.minHeight = rowHeights[row];
          sheet.appendChild(head);
        });
      }

      function placeGridItems() {
        updateSheetColumns();
        const maxRow = getMaxRow();
        const corner = root.querySelector('.corner');
        if (corner) {
          corner.style.gridColumn = '1';
          corner.style.gridRow = '1';
        }
        root.querySelectorAll('.col-head').forEach((head) => {
          const index = columnIndex(head.dataset.col);
          head.style.gridColumn = `${index + 2}`;
          head.style.gridRow = '1';
        });
        root.querySelectorAll('.row-head').forEach((head) => {
          const row = Number(head.dataset.row);
          head.style.gridColumn = '1';
          head.style.gridRow = `${row + 1}`;
        });
        root.querySelectorAll('.cell').forEach((cell) => {
          if (!cell.dataset.cell && cell.classList.contains('gray')) {
            cell.style.gridColumn = `${columns.length + 2}`;
            cell.style.gridRow = `2 / span ${maxRow}`;
            return;
          }
          if (!cell.dataset.cell) return;
          const parts = cellParts(cell);
          const index = Math.max(0, columnIndex(parts.col));
          const colspan = Math.min(colSpanOf(cell), columns.length - index);
          const rowspan = rowSpanOf(cell);
          cell.dataset.colspan = String(colspan);
          cell.dataset.rowspan = String(rowspan);
          cell.style.gridColumn = `${index + 2} / span ${colspan}`;
          cell.style.gridRow = `${parts.row + 1} / span ${rowspan}`;
          if (rowspan > 1) {
            cell.style.setProperty('--merged-height', mergedCellHeight(parts.row, rowspan));
          } else {
            cell.style.removeProperty('--merged-height');
            if (rowHeights[parts.row]) cell.style.minHeight = rowHeights[parts.row];
            else cell.style.minHeight = '';
          }
        });
      }

      function coveredBySpan(row, colIndex) {
        return Array.from(root.querySelectorAll('[data-cell]')).some((cell) => {
          const parts = cellParts(cell);
          const startCol = columnIndex(parts.col);
          const endCol = startCol + colSpanOf(cell) - 1;
          const endRow = parts.row + rowSpanOf(cell) - 1;
          return parts.row <= row && row <= endRow && startCol <= colIndex && colIndex <= endCol;
        });
      }

      function normalizeGridStructure() {
        const occupied = new Map();
        let replacementSelection = null;
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => {
            const rowDiff = Number(rowOf(a)) - Number(rowOf(b));
            return rowDiff || columnIndex(columnOf(a)) - columnIndex(columnOf(b));
          })
          .forEach((cell) => {
            const parts = cellParts(cell);
            const startCol = columnIndex(parts.col);
            if (startCol < 0 || parts.row < 1) {
              if (cell === selectedCell) selectedCell = null;
              cell.remove();
              return;
            }

            const startKey = `${parts.row}:${startCol}`;
            if (occupied.has(startKey)) {
              if (cell === selectedCell) replacementSelection = occupied.get(startKey);
              cell.remove();
              return;
            }

            const colspan = Math.min(colSpanOf(cell), columns.length - startCol);
            const rowspan = rowSpanOf(cell);
            cell.dataset.colspan = String(colspan);
            cell.dataset.rowspan = String(rowspan);
            for (let row = parts.row; row < parts.row + rowspan; row += 1) {
              for (let col = startCol; col < startCol + colspan; col += 1) {
                occupied.set(`${row}:${col}`, cell);
              }
            }
          });

        const maxRow = getMaxRow();
        for (let row = 1; row <= maxRow; row += 1) {
          columns.forEach((col, index) => {
            if (!coveredBySpan(row, index)) sheet.appendChild(createCell(col, row, ''));
          });
        }
        return replacementSelection;
      }

      function updateSheetColumns() {
        const printable = columns.map((col) => {
          const prop = `--col-${col.toLowerCase()}`;
          if (!sheet.style.getPropertyValue(prop)) sheet.style.setProperty(prop, '90px');
          return `var(${prop})`;
        }).join(' ');
        sheet.style.gridTemplateColumns = `42px ${printable}`;
      }

      function cssSizeToNumber(value, fallback) {
        const number = Number.parseFloat(String(value || ''));
        return Number.isFinite(number) ? number : fallback;
      }

      function rowHeightValue(row) {
        return cssSizeToNumber(rowHeights[row], 34);
      }

      function mergedCellHeight(startRow, rowspan) {
        let total = 0;
        for (let row = startRow; row < startRow + rowspan; row += 1) {
          total += rowHeightValue(row);
        }
        return `${total}px`;
      }

      function getCell(col, row) {
        return root.querySelector(`[data-cell="${col}${row}"]`);
      }

      function cellKey(cell) {
        const parts = cellParts(cell);
        return `${parts.col}${parts.row}`;
      }

      function getSelectionBounds(selection = selectedRange) {
        const targets = selection.filter((cell) => cell && !cell.classList.contains('gray'));
        if (!targets.length) return null;
        const leftEdges = [];
        const rightEdges = [];
        const topEdges = [];
        const bottomEdges = [];
        targets.forEach((cell) => {
          const parts = cellParts(cell);
          const col = columnIndex(parts.col);
          if (col < 0 || !parts.row) return;
          leftEdges.push(col);
          rightEdges.push(col + colSpanOf(cell) - 1);
          topEdges.push(parts.row);
          bottomEdges.push(parts.row + rowSpanOf(cell) - 1);
        });
        if (!leftEdges.length || !topEdges.length) return null;
        return {
          left: Math.min(...leftEdges),
          right: Math.max(...rightEdges),
          top: Math.min(...topEdges),
          bottom: Math.max(...bottomEdges)
        };
      }

      function findAnchorCell(row, colIndex) {
        return Array.from(root.querySelectorAll('[data-cell]')).find((cell) => {
          const parts = cellParts(cell);
          const startCol = columnIndex(parts.col);
          const endCol = startCol + colSpanOf(cell) - 1;
          const endRow = parts.row + rowSpanOf(cell) - 1;
          return parts.row <= row && row <= endRow && startCol <= colIndex && colIndex <= endCol;
        }) || null;
      }

      function rangeFromCells(startCell, endCell) {
        const start = cellParts(startCell);
        const end = cellParts(endCell);
        return {
          left: Math.min(columnIndex(start.col), columnIndex(end.col)),
          right: Math.max(columnIndex(start.col), columnIndex(end.col)),
          top: Math.min(start.row, end.row),
          bottom: Math.max(start.row, end.row)
        };
      }

      function cellRect(cell) {
        const parts = cellParts(cell);
        const left = columnIndex(parts.col);
        return {
          left,
          right: left + colSpanOf(cell) - 1,
          top: parts.row,
          bottom: parts.row + rowSpanOf(cell) - 1
        };
      }

      function rectsIntersect(first, second) {
        return first.left <= second.right && first.right >= second.left && first.top <= second.bottom && first.bottom >= second.top;
      }

      function expandRangeForMergedCells(range) {
        let expanded = { ...range };
        let changed = true;
        while (changed) {
          changed = false;
          Array.from(root.querySelectorAll('[data-cell]')).forEach((cell) => {
            if (!cell || cell.classList.contains('gray')) return;
            const rect = cellRect(cell);
            if (!rectsIntersect(expanded, rect)) return;
            const next = {
              left: Math.min(expanded.left, rect.left),
              right: Math.max(expanded.right, rect.right),
              top: Math.min(expanded.top, rect.top),
              bottom: Math.max(expanded.bottom, rect.bottom)
            };
            if (next.left !== expanded.left || next.right !== expanded.right || next.top !== expanded.top || next.bottom !== expanded.bottom) {
              expanded = next;
              changed = true;
            }
          });
        }
        expanded.left = Math.max(0, expanded.left);
        expanded.right = Math.min(columns.length - 1, expanded.right);
        expanded.top = Math.max(1, expanded.top);
        expanded.bottom = Math.max(expanded.top, expanded.bottom);
        return expanded;
      }

      function cellsInRect(range) {
        const targets = [];
        const seen = new Set();
        for (let row = range.top; row <= range.bottom; row += 1) {
          for (let col = range.left; col <= range.right; col += 1) {
            const anchor = findAnchorCell(row, col);
            if (!anchor || anchor.classList.contains('gray')) continue;
            const key = cellKey(anchor);
            if (seen.has(key)) continue;
            seen.add(key);
            targets.push(anchor);
          }
        }
        return targets;
      }

      function selectCells(targets, mode = 'range', meta = {}) {
        clearRange();
        selectionMode = mode;
        selectedRow = meta.row || null;
        selectedCol = meta.col || null;
        const seen = new Set();
        selectedRange = targets.filter((cell) => {
          if (!cell || cell.classList.contains('gray')) return false;
          const key = cellKey(cell);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        selectedRange.forEach((cell) => cell.classList.add('range-selected'));
        selectedCell = selectedRange[0] || selectedCell;
        if (selectedCell) {
          selectedCell.classList.add('selected');
          updatePanel(selectedCell);
        }
        updateHeaderSelection();
        refreshDetailTableDecorations();
        refreshDetailTableDecorations();
      }

      function selectRect(startCell, endCell) {
        if (!startCell || !endCell) return;
        const bounds = expandRangeForMergedCells(rangeFromCells(startCell, endCell));
        const targets = cellsInRect(bounds);
        selectCells(targets, targets.length > 1 ? 'range' : 'cell');
      }

      function selectedTargets() {
        const bounds = getSelectionBounds(selectedRange.length ? selectedRange : [selectedCell].filter(Boolean));
        return bounds ? cellsInRect(expandRangeForMergedCells(bounds)) : [selectedCell].filter(Boolean);
      }

      function updatePanel(cell) {
        if (!cell) return;
        const id = cell.dataset.cell || '';
        nameBox.textContent = id;
        const bounds = getSelectionBounds();
        if (selectionMode === 'row' && selectedRow) statusCell.textContent = `第 ${selectedRow} 行`;
        else if (selectionMode === 'col' && selectedCol) statusCell.textContent = `${selectedCol} 列`;
        else if (bounds && selectedRange.length > 1) statusCell.textContent = `${columns[bounds.left]}${bounds.top}:${columns[bounds.right]}${bounds.bottom}`;
        else statusCell.textContent = id;
        formula.value = cellDisplay(cell);
        updateFontFamilySelect();
        updateAlignButtons(cell);
        updateDetailPanel();
      }

      function normalizeFontFamily(value) {
        const key = String(value || '').trim();
        return Object.prototype.hasOwnProperty.call(fontFamilyCssMap, key) ? key : '';
      }

      function applyCellFontFamily(cell, value) {
        if (!cell) return;
        const fontFamily = normalizeFontFamily(value);
        if (!fontFamily) {
          delete cell.dataset.fontFamily;
          cell.style.fontFamily = '';
          return;
        }
        cell.dataset.fontFamily = fontFamily;
        cell.style.fontFamily = fontFamilyCssMap[fontFamily];
      }

      function updateFontFamilySelect() {
        const targets = selectedTargets().filter((cell) => cell && !cell.classList.contains('gray'));
        const fontFamilies = new Set(targets.map((cell) => normalizeFontFamily(cell.dataset.fontFamily)));
        fontFamilySelect.value = fontFamilies.size > 1 ? '__mixed' : (fontFamilies.values().next().value || '');
      }

      function clearRange() {
        root.querySelectorAll('.header-selected').forEach((head) => head.classList.remove('header-selected'));
        if (selectedCell) selectedCell.classList.remove('selected');
        selectedRange.forEach((cell) => cell.classList.remove('range-selected'));
        selectedRange = [];
        selectedRow = null;
        selectedCol = null;
      }

      function updateHeaderSelection() {
        root.querySelectorAll('.header-selected').forEach((head) => head.classList.remove('header-selected'));
        if (selectionMode === 'row' && selectedRow) {
          const head = root.querySelector(`[data-row="${selectedRow}"]`);
          if (head) head.classList.add('header-selected');
        }
        if (selectionMode === 'col' && selectedCol) {
          const head = root.querySelector(`.col-head[data-col="${selectedCol}"]`);
          if (head) head.classList.add('header-selected');
        }
      }

      function selectCell(cell, event) {
        if (!cell || cell.classList.contains('gray')) return;
        clearRange();
        selectionMode = 'cell';
        rangeStart = cell;
        selectedCell = cell;
        selectedRange = [cell];
        selectedCell.classList.add('range-selected');
        selectedCell.classList.add('selected');
        updatePanel(cell);
      }

      function startCellSelection(event, cell) {
        if (event.button !== 0 || cell.classList.contains('gray') || root.classList.contains('resizing')) return;
        dragSelecting = true;
        rangeStart = cell;
        selectCell(cell, event);
      }

      function updateDragSelection(cell) {
        if (!dragSelecting || !rangeStart || !cell || cell.classList.contains('gray')) return;
        selectRect(rangeStart, cell);
      }

      function endDragSelection() {
        dragSelecting = false;
      }

      function selectRow(row) {
        const rawRange = { left: 0, right: columns.length - 1, top: Number(row), bottom: Number(row) };
        const targets = cellsInRect(expandRangeForMergedCells(rawRange));
        selectCells(targets, 'row', { row: Number(row) });
      }

      function selectColumn(col) {
        const colIndex = columnIndex(col);
        const rows = getRows();
        const rawRange = { left: colIndex, right: colIndex, top: Math.min(...rows), bottom: Math.max(...rows) };
        const targets = cellsInRect(expandRangeForMergedCells(rawRange));
        selectCells(targets, 'col', { col });
      }

      function clearFieldMeta(cell) {
        delete cell.dataset.code;
        delete cell.dataset.name;
        delete cell.dataset.placeholderCodes;
        cell.dataset.source = '自定义文本';
      }

      function syncFieldMetaFromText(cell, value) {
        const text = String(value || '');
        const matches = Array.from(text.matchAll(/\$\{\s*([^}]+?)\s*\}/g));
        if (!matches.length) {
          clearFieldMeta(cell);
          return;
        }
        const preferredCodes = { ...storedPlaceholderCodes(cell) };
        const currentName = String(cell.dataset.name || '').trim();
        const currentCode = normalizeFieldCode(cell.dataset.code);
        if (currentName && currentCode) preferredCodes[currentName] = currentCode;
        const resolved = matches
          .map((match) => ({
            name: String(match[1] || '').trim(),
            code: resolvePlaceholderCode(match[1], preferredCodes),
          }))
          .filter((item) => item.name && item.code);
        if (resolved.length) {
          cell.dataset.placeholderCodes = JSON.stringify(Object.fromEntries(
            resolved.map((item) => [item.name, normalizeFieldCode(item.code)]),
          ));
        } else {
          delete cell.dataset.placeholderCodes;
        }
        if (resolved.length === 1) {
          cell.dataset.name = resolved[0].name;
          cell.dataset.code = normalizeFieldCode(resolved[0].code);
          cell.dataset.source = cell.dataset.source || '自定义文本';
          return;
        }
        delete cell.dataset.name;
        delete cell.dataset.code;
        cell.dataset.source = '自定义文本';
      }

      function clearSelectedContents() {
        if (!canEditTemplate()) return false;
        const targets = selectedTargets().filter((cell) => cell && !cell.classList.contains('gray'));
        if (!targets.length) return false;
        const seen = new Set();
        targets.forEach((cell) => {
          const key = cellKey(cell);
          if (seen.has(key)) return;
          seen.add(key);
          clearFieldMeta(cell);
          cell.innerHTML = '';
        });
        if (selectedCell) updatePanel(selectedCell);
        return true;
      }

      function isTypingTarget(target) {
        if (!target) return false;
        const tagName = target.tagName ? target.tagName.toLowerCase() : '';
        return target.isContentEditable || ['input', 'textarea', 'select', 'button'].includes(tagName);
      }

      function handleTemplateShortcut(event) {
        if (event.key !== 'Delete' && event.key !== 'Backspace') return;
        if (isTypingTarget(event.target)) return;
        if (clearSelectedContents()) event.preventDefault();
      }

      function setCustomText(cell, value) {
        if (!canEditTemplate()) return;
        if (!cell || cell.classList.contains('gray')) return;
        const snapshot = {
          html: cell.innerHTML,
          name: cell.dataset.name,
          code: cell.dataset.code,
          placeholderCodes: cell.dataset.placeholderCodes,
          source: cell.dataset.source,
        };
        syncFieldMetaFromText(cell, value);
        cell.textContent = value;
        if (templateVersion >= 2) {
          const codes = itemCodesFromDataCell({
            code: cell.dataset.code,
            html: cell.innerHTML,
            placeholderCodes: cellPlaceholderCodeMap(cell),
          });
          const bodyCell = detailTable && cellFullyInDetailSection(cell, 'body');
          const touchesBody = detailTable && cellIntersectsDetailSection(cell, 'body');
          const hasDetailCode = codes.some(fieldCodeIsDetail);
          const hasMainCode = codes.some((code) => !fieldCodeIsDetail(code));
          const invalid = (hasDetailCode && !bodyCell) || (hasMainCode && touchesBody);
          if (invalid) {
            cell.innerHTML = snapshot.html;
            if (snapshot.name === undefined) delete cell.dataset.name; else cell.dataset.name = snapshot.name;
            if (snapshot.code === undefined) delete cell.dataset.code; else cell.dataset.code = snapshot.code;
            if (snapshot.placeholderCodes === undefined) delete cell.dataset.placeholderCodes;
            else cell.dataset.placeholderCodes = snapshot.placeholderCodes;
            if (snapshot.source === undefined) delete cell.dataset.source; else cell.dataset.source = snapshot.source;
            showToast(hasDetailCode && !bodyCell
              ? '明细字段只能放在明细表组件的循环体内'
              : '主表和系统字段不能放在明细循环体内');
            updatePanel(cell);
            return;
          }
        }
        updatePanel(cell);
      }

      function putFieldIntoCell(field, cell) {
        if (!canEditTemplate()) return;
        if (!field || !cell || cell.classList.contains('gray')) return;
        if (!canPlaceFieldInCell(field, cell)) {
          showToast(detailPlacementMessage(field, cell));
          cell.classList.add('detail-invalid');
          window.setTimeout(() => cell.classList.remove('detail-invalid'), 1800);
          return;
        }
        const name = field.dataset.name || '';
        cell.dataset.name = name;
        cell.dataset.code = normalizeFieldCode(field.dataset.code);
        cell.dataset.placeholderCodes = JSON.stringify({ [name]: normalizeFieldCode(field.dataset.code) });
        cell.dataset.source = field.dataset.source || '';
        cell.innerHTML = `<span class="token">${escapeHtml(fieldDisplay(name))}</span>`;
        selectCell(cell);
        updateDetailUi();
      }

      function applyRowHeight(row, height) {
        const px = `${Math.max(minRowHeight, Math.round(height))}px`;
        rowHeights[row] = px;
        const rowHead = root.querySelector(`[data-row="${row}"]`);
        if (rowHead) rowHead.style.minHeight = px;
        cells.filter((cell) => rowOf(cell) === String(row)).forEach((cell) => {
          cell.style.minHeight = px;
        });
      }

      function startColResize(event, handle) {
        if (!canEditTemplate()) return;
        event.preventDefault();
        event.stopPropagation();
        const col = handle.dataset.colResize;
        const prop = `--col-${col.toLowerCase()}`;
        const startX = event.clientX;
        const startWidth = parseFloat(getComputedStyle(sheet).getPropertyValue(prop)) || handle.parentElement.getBoundingClientRect().width;
        handle.classList.add('dragging');
        root.classList.add('resizing');
        root.style.cursor = 'col-resize';

        function move(moveEvent) {
          const next = Math.max(minColWidth, startWidth + moveEvent.clientX - startX);
          sheet.style.setProperty(prop, `${Math.round(next)}px`);
        }

        function up() {
          handle.classList.remove('dragging');
          root.classList.remove('resizing');
          root.style.cursor = '';
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        }

        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      }

      function startRowResize(event, handle) {
        if (!canEditTemplate()) return;
        event.preventDefault();
        event.stopPropagation();
        const row = handle.dataset.rowResize;
        const rowHead = root.querySelector(`[data-row="${row}"]`);
        const startY = event.clientY;
        const startHeight = rowHead ? rowHead.getBoundingClientRect().height : minRowHeight;
        handle.classList.add('dragging');
        root.classList.add('resizing');
        root.style.cursor = 'row-resize';

        function move(moveEvent) {
          applyRowHeight(row, startHeight + moveEvent.clientY - startY);
        }

        function up() {
          handle.classList.remove('dragging');
          root.classList.remove('resizing');
          root.style.cursor = '';
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        }

        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      }

      function bindCell(cell) {
        if (cell.dataset.bound === 'true') return;
        cell.dataset.bound = 'true';
        cell.addEventListener('mousedown', (event) => startCellSelection(event, cell));
        cell.addEventListener('mouseenter', () => updateDragSelection(cell));
        cell.addEventListener('dblclick', () => {
          if (!canEditTemplate()) return;
          if (cell.classList.contains('gray')) return;
          selectCell(cell);
          cell.setAttribute('contenteditable', 'true');
          cell.focus();
          const range = document.createRange();
          range.selectNodeContents(cell);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        });
        cell.addEventListener('input', () => {
          if (!canEditTemplate()) return;
          const text = cell.textContent.trim();
          syncFieldMetaFromText(cell, text);
          formula.value = text;
        });
        cell.addEventListener('blur', () => {
          cell.removeAttribute('contenteditable');
          updatePanel(cell);
        });
        cell.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            cell.blur();
          }
        });
        cell.addEventListener('dragover', (event) => {
          if (!canEditTemplate()) return;
          if (!draggedField || cell.classList.contains('gray')) return;
          event.preventDefault();
          if (canPlaceFieldInCell(draggedField, cell)) cell.classList.add('drop-ready');
        });
        cell.addEventListener('dragleave', () => cell.classList.remove('drop-ready'));
        cell.addEventListener('drop', (event) => {
          if (!canEditTemplate()) return;
          event.preventDefault();
          cell.classList.remove('drop-ready');
          putFieldIntoCell(draggedField, cell);
        });
      }

      function bindResizeHandles() {
        root.querySelectorAll('.col-head[data-col]').forEach((head) => {
          if (head.dataset.selectBound === 'true') return;
          head.dataset.selectBound = 'true';
          head.addEventListener('click', (event) => {
            if (event.target.closest('.col-resizer')) return;
            selectColumn(head.dataset.col);
          });
          head.addEventListener('contextmenu', (event) => {
            openColumnContextMenu(event, head.dataset.col);
          });
        });
        root.querySelectorAll('.row-head[data-row]').forEach((head) => {
          if (head.dataset.selectBound === 'true') return;
          head.dataset.selectBound = 'true';
          head.addEventListener('click', (event) => {
            if (event.target.closest('.row-resizer')) return;
            selectRow(head.dataset.row);
          });
          head.addEventListener('contextmenu', (event) => {
            openRowContextMenu(event, head.dataset.row);
          });
        });
        root.querySelectorAll('[data-col-resize]').forEach((handle) => {
          if (handle.dataset.bound === 'true') return;
          handle.dataset.bound = 'true';
          handle.addEventListener('mousedown', (event) => startColResize(event, handle));
        });
        root.querySelectorAll('[data-row-resize]').forEach((handle) => {
          if (handle.dataset.bound === 'true') return;
          handle.dataset.bound = 'true';
          handle.addEventListener('mousedown', (event) => startRowResize(event, handle));
        });
      }

      function refreshCells() {
        const replacementSelection = normalizeGridStructure();
        renderColumnHeads();
        renderRowHeads();
        placeGridItems();
        cells = Array.from(root.querySelectorAll('[data-cell]'));
        cells.forEach(bindCell);
        bindResizeHandles();
        if (replacementSelection && sheet.contains(replacementSelection)) selectedCell = replacementSelection;
        if (!selectedCell || !sheet.contains(selectedCell)) {
          selectedCell = cells.find((cell) => !cell.classList.contains('gray')) || null;
        }
        selectedRange = selectedRange.filter((cell) => sheet.contains(cell) && !cell.classList.contains('gray'));
        if (!selectedRange.length && selectedCell) selectedRange = [selectedCell];
        selectedRange = selectedTargets();
        selectedRange.forEach((cell) => cell.classList.add('range-selected'));
        if (selectedCell) {
          selectedCell.classList.add('selected');
          updatePanel(selectedCell);
        }
        updateHeaderSelection();
      }

      function cellHtml(cell) {
        return cell.innerHTML || '';
      }

      function alignFromClasses(classes = []) {
        if (classes.includes('right')) return 'right';
        if (classes.includes('center')) return 'center';
        if (classes.includes('left')) return 'left';
        return 'left';
      }

      function textAlignOf(cell) {
        if (cell.classList.contains('right')) return 'right';
        if (cell.classList.contains('center')) return 'center';
        return 'left';
      }

      function applyTextAlign(cell, align) {
        if (!cell || cell.classList.contains('gray')) return;
        cell.classList.remove('left', 'center', 'right');
        cell.classList.add(['left', 'center', 'right'].includes(align) ? align : 'left');
      }

      function updateAlignButtons(cell) {
        const align = cell ? textAlignOf(cell) : 'left';
        alignButtons.forEach((button) => {
          const active = button.dataset.align === align;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', String(active));
        });
      }

      function createCell(col, row, content) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.cell = `${col}${row}`;
        cell.dataset.colspan = '1';
        cell.dataset.rowspan = '1';
        cell.innerHTML = content || '';
        bindCell(cell);
        return cell;
      }

      function createRowHead(row) {
        const head = document.createElement('div');
        head.className = 'row-head';
        head.dataset.row = String(row);
        head.innerHTML = `${row}<span class="row-resizer" data-row-resize="${row}"></span>`;
        return head;
      }

      function createBlankTemplate(rowCount = 31, columnCount = 18) {
        currentTemplateId = 'default';
        currentTemplateName = '默认模板';
        currentTemplateDefaulted = false;
        templateVersion = 2;
        detailTable = null;
        columns = buildColumns(columnCount);
        rowHeights = {};
        root.querySelectorAll('.cell').forEach((cell) => cell.remove());
        columns.forEach((col) => {
          const prop = `--col-${col.toLowerCase()}`;
          sheet.style.setProperty(prop, '90px');
        });
        for (let row = 1; row <= rowCount; row += 1) {
          columns.forEach((col) => sheet.appendChild(createCell(col, row, '')));
        }
        selectedCell = root.querySelector('[data-cell="A1"]');
        selectedRange = selectedCell ? [selectedCell] : [];
        rangeStart = selectedCell;
        selectionMode = 'cell';
        selectedRow = null;
        selectedCol = null;
        refreshCells();
        updateTemplateTitle();
        updateDetailUi();
        ensurePrintFontsLoaded().catch((error) => showToast(error.message || '内置打印字体加载失败'));
      }

      function detailFieldElements() {
        return fields.filter((field) => field.dataset.group === 'detail' || fieldCodeIsDetail(field.dataset.code));
      }

      function isBlankDetailInsertCell(cell) {
        return cell && !cell.classList.contains('gray') && !String(cell.textContent || '').trim()
          && colSpanOf(cell) === 1 && rowSpanOf(cell) === 1;
      }

      function applyDefaultDetailCellStyle(cell, header = false) {
        cell.classList.add('table-border', 'center');
        if (header) cell.classList.add('bold');
      }

      function insertStandardDetailTable() {
        if (!canEditTemplate()) return;
        if (detailTable) {
          showToast('当前模板已存在明细表组件');
          return;
        }
        const availableFields = detailFieldElements().slice(0, 6);
        if (!availableFields.length) {
          showToast('当前模块没有可用的明细字段');
          return;
        }
        const anchor = selectedCell || getCell(columns[0], 1);
        const anchorParts = cellParts(anchor);
        const startIndex = columnIndex(anchorParts.col);
        const width = Math.min(availableFields.length, columns.length - startIndex);
        const headerRow = anchorParts.row;
        const bodyRow = headerRow + 1;
        if (bodyRow > getMaxRow() || width < 1) {
          showToast('当前位置没有足够空间插入明细表组件');
          return;
        }
        const targetCells = [];
        for (let row = headerRow; row <= bodyRow; row += 1) {
          for (let index = startIndex; index < startIndex + width; index += 1) {
            const cell = findAnchorCell(row, index);
            if (!isBlankDetailInsertCell(cell)) {
              showToast(`目标区域包含内容或合并单元格，请选择空白位置（${columns[index]}${row}）`);
              return;
            }
            targetCells.push(cell);
          }
        }
        detailTable = {
          id: 'detail-table',
          dataSource: 'items',
          startColumn: columns[startIndex],
          endColumn: columns[startIndex + width - 1],
          headerRows: { start: headerRow, end: headerRow },
          bodyRows: { start: bodyRow, end: bodyRow },
          footerRows: null,
          repeatHeader: true,
        };
        templateVersion = 2;
        availableFields.slice(0, width).forEach((field, offset) => {
          const headerCell = getCell(columns[startIndex + offset], headerRow);
          const bodyCell = getCell(columns[startIndex + offset], bodyRow);
          clearFieldMeta(headerCell);
          headerCell.textContent = field.dataset.name || '';
          applyDefaultDetailCellStyle(headerCell, true);
          bodyCell.dataset.name = field.dataset.name || '';
          bodyCell.dataset.code = normalizeFieldCode(field.dataset.code);
          bodyCell.dataset.source = field.dataset.source || '';
          bodyCell.innerHTML = `<span class="token">${escapeHtml(fieldDisplay(field.dataset.name || ''))}</span>`;
          applyDefaultDetailCellStyle(bodyCell, false);
        });
        selectCells(targetCells, 'range');
        refreshDetailTableDecorations();
        updateDetailUi();
        showToast('已插入明细表组件');
      }

      function openDetailConversion(bounds, defaults = {}) {
        if (detailTable) {
          showToast('当前模板已存在明细表组件');
          return;
        }
        if (!bounds || bounds.left < 0 || bounds.right >= columns.length || bounds.top < 1 || bounds.bottom < bounds.top) {
          showToast('请选择连续的矩形区域');
          return;
        }
        pendingDetailConversionBounds = { ...bounds };
        const rowCount = bounds.bottom - bounds.top + 1;
        const bodyStart = Math.max(bounds.top, Number(defaults.bodyStart) || bounds.top + Math.min(1, rowCount - 1));
        const bodyEnd = Math.min(bounds.bottom, Math.max(bodyStart, Number(defaults.bodyEnd) || bodyStart));
        detailHeaderCountInput.value = String(Math.max(0, bodyStart - bounds.top));
        detailBodyCountInput.value = String(Math.max(1, bodyEnd - bodyStart + 1));
        detailFooterCountInput.value = String(Math.max(0, bounds.bottom - bodyEnd));
        detailConvertRange.textContent = `选区：${columns[bounds.left]}${bounds.top}:${columns[bounds.right]}${bounds.bottom}，三段行数之和必须等于 ${rowCount}。`;
        openModal(detailConvertModal);
      }

      function openSelectedDetailConversion() {
        const bounds = getSelectionBounds(selectedRange.length ? selectedRange : [selectedCell].filter(Boolean));
        if (!bounds) {
          showToast('请先选择要转换的矩形区域');
          return;
        }
        const expanded = expandRangeForMergedCells(bounds);
        const data = serializeTemplate();
        const itemRowList = itemRows(data).filter((row) => row >= expanded.top && row <= expanded.bottom);
        openDetailConversion(expanded, itemRowList.length ? {
          bodyStart: Math.min(...itemRowList),
          bodyEnd: Math.max(...itemRowList),
        } : {});
      }

      function confirmDetailConversion() {
        const bounds = pendingDetailConversionBounds;
        if (!bounds) return;
        const headerCount = Math.max(0, Number(detailHeaderCountInput.value) || 0);
        const bodyCount = Math.max(0, Number(detailBodyCountInput.value) || 0);
        const footerCount = Math.max(0, Number(detailFooterCountInput.value) || 0);
        const rowCount = bounds.bottom - bounds.top + 1;
        if (bodyCount < 1 || headerCount + bodyCount + footerCount !== rowCount) {
          showToast(`表头、循环体、表尾行数之和必须等于 ${rowCount}，且循环体至少 1 行`);
          return;
        }
        const bodyStart = bounds.top + headerCount;
        const bodyEnd = bodyStart + bodyCount - 1;
        detailTable = {
          id: 'detail-table',
          dataSource: 'items',
          startColumn: columns[bounds.left],
          endColumn: columns[bounds.right],
          headerRows: headerCount ? { start: bounds.top, end: bodyStart - 1 } : null,
          bodyRows: { start: bodyStart, end: bodyEnd },
          footerRows: footerCount ? { start: bodyEnd + 1, end: bounds.bottom } : null,
          repeatHeader: true,
        };
        templateVersion = 2;
        closeModal(detailConvertModal);
        pendingDetailConversionBounds = null;
        selectCells(cellsInRect(bounds), 'range');
        updateDetailUi();
        const errors = validateExplicitDetailTable(serializeTemplate(), true);
        if (errors.length) showToast(`已转换，请调整以下字段后保存：${errors.slice(0, 2).join('；')}`);
        else showToast('选区已转换为唯一明细表组件');
      }

      function detailRangeFromInputs(startInput, endInput, required = false) {
        const start = Number(startInput.value) || 0;
        const end = Number(endInput.value) || 0;
        if (!start && !end && !required) return null;
        if (start < 1 || end < start) return null;
        return { start, end };
      }

      function detailTableHasCrossBoundaryMerge(table) {
        return Array.from(root.querySelectorAll('[data-cell]')).some((cell) => {
          const rect = cellRect(cell);
          const sections = new Set();
          for (let row = rect.top; row <= rect.bottom; row += 1) {
            for (let col = rect.left; col <= rect.right; col += 1) sections.add(detailSectionForPosition(row, col, table));
          }

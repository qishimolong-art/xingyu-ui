          window.setTimeout(clearPrintDocument, 300);
        } catch (error) {
          showToast(error.message || '打印失败');
          clearPrintDocument();
        }
      }

      function forEachSelected(callback) {
        selectedTargets().forEach((cell) => {
          if (cell && !cell.classList.contains('gray')) callback(cell);
        });
      }

      function toggleBold() {
        if (!canEditTemplate()) return;
        const targets = selectedTargets().filter((cell) => cell && !cell.classList.contains('gray'));
        if (!targets.length) return;
        const shouldBold = targets.some((cell) => !cell.classList.contains('bold'));
        targets.forEach((cell) => cell.classList.toggle('bold', shouldBold));
      }

      function applyFontSize() {
        if (!canEditTemplate()) return;
        forEachSelected((cell) => {
          cell.style.fontSize = `${fontSizeSelect.value}pt`;
        });
      }

      function applyFontFamily() {
        if (!canEditTemplate() || fontFamilySelect.value === '__mixed') return;
        forEachSelected((cell) => applyCellFontFamily(cell, fontFamilySelect.value));
        updateFontFamilySelect();
      }

      function applyTextAlignment(align) {
        if (!canEditTemplate()) return;
        forEachSelected((cell) => applyTextAlign(cell, align));
        updateAlignButtons(selectedCell);
      }

      function setCellBorder(cell, side, enabled) {
        if (side === 'top') cell.classList.toggle('border-top', enabled);
        if (side === 'right') cell.classList.toggle('border-right', enabled);
        if (side === 'bottom') cell.classList.toggle('border-bottom', enabled);
        if (side === 'left') cell.classList.toggle('border-left', enabled);
      }

      function clearBorders(cell) {
        ['border-top', 'border-right', 'border-bottom', 'border-left', 'manual-border'].forEach((name) => cell.classList.remove(name));
      }

      function applyBorder(action) {
        if (!canEditTemplate()) return;
        const targets = selectedTargets().filter((cell) => cell && !cell.classList.contains('gray'));
        const bounds = getSelectionBounds(targets);
        if (!targets.length || !bounds) return;
        if (action === 'clear') {
          targets.forEach(clearBorders);
          return;
        }
        if (action === 'all') {
          targets.forEach((cell) => {
            ['top', 'right', 'bottom', 'left'].forEach((side) => setCellBorder(cell, side, true));
          });
          return;
        }
        targets.forEach((cell) => {
          const parts = cellParts(cell);
          const col = columnIndex(parts.col);
          if (action === 'top' && parts.row === bounds.top) setCellBorder(cell, 'top', true);
          if (action === 'right' && col + colSpanOf(cell) - 1 === bounds.right) setCellBorder(cell, 'right', true);
          if (action === 'bottom' && parts.row + rowSpanOf(cell) - 1 === bounds.bottom) setCellBorder(cell, 'bottom', true);
          if (action === 'left' && col === bounds.left) setCellBorder(cell, 'left', true);
        });
      }

      function unmergeCell(cell) {
        if (!cell || (colSpanOf(cell) === 1 && rowSpanOf(cell) === 1)) return;
        cell.dataset.colspan = '1';
        cell.dataset.rowspan = '1';
        cell.style.gridColumn = '';
        cell.style.gridRow = '';
      }

      function mergeCells() {
        if (!canEditTemplate()) return;
        if (!selectedCell || selectedCell.classList.contains('gray')) return;
        const currentTargets = selectedTargets().filter((cell) => cell && !cell.classList.contains('gray'));
        const currentBounds = getSelectionBounds(currentTargets);
        const isSingleMergedCell = currentTargets.length === 1 && selectedCell && (colSpanOf(selectedCell) > 1 || rowSpanOf(selectedCell) > 1);
        if (isSingleMergedCell) {
          unmergeCell(selectedCell);
          clearRange();
          refreshCells();
          selectCell(selectedCell);
          return;
        }
        if (!currentBounds) return;
        const bounds = expandRangeForMergedCells(currentBounds);
        if (bounds.left === bounds.right && bounds.top === bounds.bottom) return;

        currentTargets.forEach(unmergeCell);
        refreshCells();
        const mergeRange = cellsInRect(bounds);
        const expectedCount = (bounds.right - bounds.left + 1) * (bounds.bottom - bounds.top + 1);
        if (mergeRange.length !== expectedCount) return;

        const master = getCell(columns[bounds.left], bounds.top);
        if (!master) return;
        master.dataset.colspan = String(bounds.right - bounds.left + 1);
        master.dataset.rowspan = String(bounds.bottom - bounds.top + 1);
        master.innerHTML = mergeRange.map(cellHtml).filter(Boolean).join(' ');
        mergeRange.filter((cell) => cell !== master).forEach((cell) => {
          cell.remove();
        });
        clearRange();
        refreshCells();
        selectCell(master);
      }

      function activeRow() {
        return selectedRow || (selectedCell ? Number(rowOf(selectedCell)) : 1);
      }

      function activeColIndex() {
        if (selectedCol) return columnIndex(selectedCol);
        return selectedCell ? columnIndex(columnOf(selectedCell)) : 0;
      }

      function addRow(position = 'after') {
        if (!canEditTemplate()) return;
        if (!selectedCell) return;
        const row = activeRow();
        const insertBefore = position === 'before';
        const newRow = insertBefore ? row : row + 1;
        const boundaryRow = insertBefore ? row - 1 : row;
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => Number(rowOf(b)) - Number(rowOf(a)))
          .forEach((cell) => {
            const parts = cellParts(cell);
            const rowspan = rowSpanOf(cell);
            const endRow = parts.row + rowspan - 1;
            if (parts.row >= newRow) setCellPosition(cell, parts.col, parts.row + 1);
            else if (parts.row <= boundaryRow && endRow > boundaryRow) cell.dataset.rowspan = String(rowspan + 1);
          });
        rowHeights = Object.fromEntries(Object.entries(rowHeights).map(([key, value]) => {
          const number = Number(key);
          return [number >= newRow ? number + 1 : number, value];
        }));
        columns.forEach((col, index) => {
          if (!coveredBySpan(newRow, index)) sheet.appendChild(createCell(col, newRow, ''));
        });
        refreshCells();
        selectCell(getCell('A', newRow));
      }

      function deleteRow() {
        if (!canEditTemplate()) return;
        if (!selectedCell) return;
        const row = activeRow();
        if (getRows().length <= 1) return;
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => Number(rowOf(a)) - Number(rowOf(b)))
          .forEach((cell) => {
            const parts = cellParts(cell);
            const rowspan = rowSpanOf(cell);
            const endRow = parts.row + rowspan - 1;
            if (parts.row === row) {
              if (rowspan > 1) {
                cell.dataset.rowspan = String(rowspan - 1);
              } else {
                cell.remove();
              }
            } else if (parts.row < row && endRow >= row) {
              cell.dataset.rowspan = String(rowspan - 1);
            } else if (parts.row > row) {
              setCellPosition(cell, parts.col, parts.row - 1);
            }
          });
        rowHeights = Object.fromEntries(Object.entries(rowHeights)
          .filter(([key]) => Number(key) !== row)
          .map(([key, value]) => {
            const number = Number(key);
            return [number > row ? number - 1 : number, value];
          }));
        refreshCells();
        const targetRow = Math.min(row, Math.max(...getRows()));
        selectCell(getCell('A', targetRow) || root.querySelector('[data-cell]:not(.gray)'));
      }

      function addColumn(position = 'after') {
        if (!canEditTemplate()) return;
        if (!selectedCell) return;
        const index = Math.max(0, activeColIndex());
        const insertIndex = position === 'before' ? index : index + 1;
        const boundaryIndex = position === 'before' ? index - 1 : index;
        const targetRow = Number(rowOf(selectedCell));
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => columnIndex(columnOf(b)) - columnIndex(columnOf(a)))
          .forEach((cell) => {
            const parts = cellParts(cell);
            const start = columnIndex(parts.col);
            const colspan = colSpanOf(cell);
            const end = start + colspan - 1;
            if (start >= insertIndex) setCellPosition(cell, columnLabel(start + 1), parts.row);
            else if (start <= boundaryIndex && end > boundaryIndex) cell.dataset.colspan = String(colspan + 1);
          });
        columns = buildColumns(columns.length + 1);
        getRows().forEach((row) => {
          if (!coveredBySpan(row, insertIndex)) sheet.appendChild(createCell(columnLabel(insertIndex), row, ''));
        });
        refreshCells();
        selectCell(getCell(columnLabel(insertIndex), targetRow));
      }

      function deleteColumn() {
        if (!canEditTemplate()) return;
        if (!selectedCell) return;
        if (columns.length <= 1) return;
        const index = activeColIndex();
        const targetRow = Number(rowOf(selectedCell));
        Array.from(root.querySelectorAll('[data-cell]'))
          .sort((a, b) => columnIndex(columnOf(a)) - columnIndex(columnOf(b)))
          .forEach((cell) => {
            const parts = cellParts(cell);
            const start = columnIndex(parts.col);
            const colspan = colSpanOf(cell);
            const end = start + colspan - 1;
            if (start === index) {
              if (colspan > 1) {
                cell.dataset.colspan = String(colspan - 1);
              } else {
                cell.remove();
              }
            } else if (start < index && end >= index) {
              cell.dataset.colspan = String(colspan - 1);
            } else if (start > index) {
              setCellPosition(cell, columnLabel(start - 1), parts.row);
            }
          });
        columns = buildColumns(columns.length - 1);
        refreshCells();
        selectCell(getCell(columnLabel(Math.min(index, columns.length - 1)), targetRow) || root.querySelector('[data-cell]:not(.gray)'));
      }

      function closeSheetContextMenu() {
        if (!sheetContextMenu) return;
        sheetContextMenu.classList.remove('is-open');
        sheetContextMenu.setAttribute('aria-hidden', 'true');
        sheetContextMenu.replaceChildren();
      }

      function createContextMenuButton(label, action, danger = false) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        if (danger) button.classList.add('danger');
        button.addEventListener('click', () => {
          action();
          closeSheetContextMenu();
        });
        return button;
      }

      function positionSheetContextMenu(event) {
        sheetContextMenu.style.left = '0px';
        sheetContextMenu.style.top = '0px';
        sheetContextMenu.classList.add('is-open');
        sheetContextMenu.setAttribute('aria-hidden', 'false');
        const rect = sheetContextMenu.getBoundingClientRect();
        const left = Math.max(8, Math.min(event.clientX, window.innerWidth - rect.width - 8));
        const top = Math.max(8, Math.min(event.clientY, window.innerHeight - rect.height - 8));
        sheetContextMenu.style.left = `${left}px`;
        sheetContextMenu.style.top = `${top}px`;
      }

      function openRowContextMenu(event, row) {
        if (!canEditTemplate() || printMode || event.target.closest('.row-resizer')) return;
        event.preventDefault();
        event.stopPropagation();
        selectRow(row);
        sheetContextMenu.replaceChildren(
          createContextMenuButton('上方插入行', () => addRow('before')),
          createContextMenuButton('下方插入行', () => addRow('after')),
          createContextMenuButton('删除当前行', deleteRow, true)
        );
        positionSheetContextMenu(event);
      }

      function openColumnContextMenu(event, col) {
        if (!canEditTemplate() || printMode || event.target.closest('.col-resizer')) return;
        event.preventDefault();
        event.stopPropagation();
        selectColumn(col);
        sheetContextMenu.replaceChildren(
          createContextMenuButton('左侧插入列', () => addColumn('before')),
          createContextMenuButton('右侧插入列', () => addColumn('after')),
          createContextMenuButton('删除当前列', deleteColumn, true)
        );
        positionSheetContextMenu(event);
      }

      function bindFields() {
        if (!canEditTemplate()) return;
        fields.forEach((field) => {
          if (field.dataset.bound === 'true') return;
          field.dataset.bound = 'true';
          field.addEventListener('dragstart', () => {
            draggedField = field;
          });
          field.addEventListener('dragend', () => {
            draggedField = null;
            cells.forEach((cell) => cell.classList.remove('drop-ready'));
          });
          field.addEventListener('click', () => putFieldIntoCell(field, selectedCell));
        });
      }

      async function loadFieldMetadata() {
        if (!canEditTemplate()) {
          if (fieldTree) fieldTree.replaceChildren();
          fields = [];
          return;
        }
        try {
          const metadata = await apiRequest(`/erp/print/fields?moduleKey=${encodeURIComponent(moduleKey)}`);
          renderFieldGroups(metadata);
        } catch (error) {
          if (fieldTree) {
            const empty = document.createElement('div');
            empty.className = 'field-empty';
            empty.textContent = '字段读取失败';
            fieldTree.replaceChildren(empty);
          }
          fields = [];
        }
      }

      async function loadPrintData() {
        if (!businessId) return;
        try {
          printData = await apiRequest(`/erp/print/data?moduleKey=${encodeURIComponent(moduleKey)}&businessId=${businessId}`);
        } catch (error) {
          printData = null;
          showToast(error.message || '读取打印数据失败');
        }
      }

      async function initTemplate() {
        root.classList.toggle('is-print-mode', printMode);
        root.classList.toggle('is-print-preparing', printMode);
        if (formula) formula.readOnly = printMode;
        createBlankTemplate();
        bindFields();
        try {
          if (designMode) {
            await loadFieldMetadata();
            await loadTemplateList();
          }
          await restoreLastTemplate();
          if (designMode) renderTemplateOptions();
          await loadPrintData();
          updatePanel(selectedCell);
          if (printMode && businessId) {
            renderPreview();
          } else {
            root.classList.remove('is-print-preparing');
          }
        } catch (error) {
          if (!printMode) root.classList.remove('is-print-preparing');
          showToast(error.message || '初始化打印模板失败');
        }
      }

      function handlePaperPresetChange() {
        const size = normalizePaperSize(paperSizeSelect.value);
        const preset = paperPresets[size] || paperPresets.custom;
        applyPaperConfig({
          size,
          width: preset.width,
          height: preset.height,
        });
      }

      function handlePaperDimensionInput() {
        applyPaperConfig({
          size: 'custom',
          width: paperWidthInput.value,
          height: paperHeightInput.value,
        });
      }

      function handlePaperMarginInput(position, input) {
        applyPaperConfig({
          margins: {
            [position]: input.value,
          },
        });
      }

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        if (event.data?.source !== 'erp-print-template-parent') return;
        if (event.data?.type !== 'auth') return;
        parentAuth = event.data.payload || {};
        if (authReadyResolve) {
          authReadyResolve();
          authReadyResolve = null;
        }
      });

      search.addEventListener('input', () => {
        applyFieldSearch();
      });

      insertButton.addEventListener('click', () => {
        const firstVisibleField = fields.find((field) => field.style.display !== 'none');
        putFieldIntoCell(firstVisibleField, selectedCell);
      });

      borderSelect.addEventListener('change', () => {
        if (borderSelect.value) applyBorder(borderSelect.value);
        borderSelect.value = '';
      });

      boldButton.addEventListener('click', toggleBold);
      alignButtons.forEach((button) => {
        button.addEventListener('click', () => applyTextAlignment(button.dataset.align || 'left'));
      });
      mergeButton.addEventListener('click', mergeCells);
      fontFamilySelect.addEventListener('change', applyFontFamily);
      fontSizeSelect.addEventListener('change', applyFontSize);
      formula.addEventListener('input', () => setCustomText(selectedCell, formula.value));
      previewButton.addEventListener('click', renderPreview);
      if (paginationDemoButton) paginationDemoButton.addEventListener('click', openPaginationDemo);
      printPreviewButton.addEventListener('click', printCurrentTemplate);
      closePreviewButton.addEventListener('click', () => closeModal(previewModal));
      previewModal.addEventListener('click', (event) => {
        if (event.target === previewModal) closeModal(previewModal);
      });
      saveButton.addEventListener('click', saveCurrentTemplate);
      setDefaultButton.addEventListener('click', setCurrentTemplateDefault);
      templateSelect.addEventListener('change', async () => {
        if (!canEditTemplate()) return;
        try {
          await loadTemplateById(templateSelect.value);
          updatePanel(selectedCell);
        } catch (error) {
          showToast(error.message || '模板切换失败');
          renderTemplateOptions();
        }
      });
      saveAsButton.addEventListener('click', () => {
        templateNameInput.value = currentTemplateName === '默认模板' ? '采购订单模板副本' : `${currentTemplateName} 副本`;
        openModal(saveAsModal);
        templateNameInput.focus();
        templateNameInput.select();
      });
      cancelSaveAsButton.addEventListener('click', () => closeModal(saveAsModal));
      saveAsModal.addEventListener('click', (event) => {
        if (event.target === saveAsModal) closeModal(saveAsModal);
      });
      confirmSaveAsButton.addEventListener('click', async () => {
        const name = templateNameInput.value.trim();
        if (!name) {
          showToast('请填写模板名称');
          templateNameInput.focus();
          return;
        }
        try {
          await saveAsCurrentTemplate(name);
          showToast('模板已另存为');
          closeModal(saveAsModal);
        } catch (error) {
          showToast(error.message || '另存为失败');
        }
      });
      templateNameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') confirmSaveAsButton.click();
        if (event.key === 'Escape') closeModal(saveAsModal);
      });
      paperSizeSelect.addEventListener('change', handlePaperPresetChange);
      paperOrientationSelect.addEventListener('change', () => applyPaperConfig({ orientation: paperOrientationSelect.value }));
      paperWidthInput.addEventListener('input', handlePaperDimensionInput);
      paperHeightInput.addEventListener('input', handlePaperDimensionInput);
      paperMarginTopInput.addEventListener('input', () => handlePaperMarginInput('top', paperMarginTopInput));
      paperMarginRightInput.addEventListener('input', () => handlePaperMarginInput('right', paperMarginRightInput));
      paperMarginBottomInput.addEventListener('input', () => handlePaperMarginInput('bottom', paperMarginBottomInput));
      paperMarginLeftInput.addEventListener('input', () => handlePaperMarginInput('left', paperMarginLeftInput));
      window.addEventListener('afterprint', clearPrintDocument);
      window.addEventListener('keydown', handleTemplateShortcut);
      window.addEventListener('mouseup', endDragSelection);
      window.addEventListener('click', (event) => {
        if (sheetContextMenu && !sheetContextMenu.contains(event.target)) closeSheetContextMenu();
      });
      window.addEventListener('resize', closeSheetContextMenu);
      sheetScroll.addEventListener('scroll', closeSheetContextMenu);
      if (window.parent !== window) {
        window.parent.postMessage({ source: 'erp-print-template', type: 'ready-for-auth' }, window.location.origin);
      }
      applyPaperConfig();
      void initTemplate();
    })();
  </script>
</div>
